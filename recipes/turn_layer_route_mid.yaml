# Layer routing, part 2: does the turn head become confident earlier if it reads mid-encoder blocks?
# trail6 (recipes/stage1_turn_v3_trail6.yaml, the served turn head) reads the TOP layer of the speaker-conditioned
# encoder pass (speaker kernels at encoder layers [0, 2]). Here the head reads a learned softmax mix restricted to
# blocks 4-12 of that same conditioned pass (from_layers: [3..11]; the mix starts uniform); the kernels, the ASR text
# path (RNNT PredictionNet on the conditioned top layer) and everything else are unchanged.
# Head only (init.train_only: heads.turn + layer_mix.turn), warm-started from the served model, whose turn head IS trail6
# (runs/served_model_build.json: all 747 non-spk tensors from runs/stage1_turn_v3_trail6.afm). Same data, conditioning
# and schedule as trail6's (only) stage: AMI 20 s turn windows with 6 s trails + streaming Sortformer tracks (p_ext 0.9,
# ext_noise) + synthetic conversations at 0.3, 2000 steps, batch 6, lr 1e-3.
# The top-layer CONTROL is this recipe with heads.turn.from_layers=null (identical data / steps / warm start).
#
# GPU (one job on the machine; ~20 min):
#   trained by a research driver (not published); output runs/stage1_turn_mid4to12.afm
name: turn_layer_route_mid
init: {from: runs/stage1_served.afm, pretrained_lr_mult: 0, train_only: [heads.turn, layer_mix.turn]}
encoder: {att_context_size: [70, 1], att_context_sizes: [[70, 1]], speaker_kernel_layers: [0, 2]}
heads:
  rnnt: {weight: 0}
  ctc: {weight: 0}
  vad: {weight: 0}
  eou: {weight: 0}
  spk: {weight: 0}
  diar: {weight: 0}
  turn: {type: turn, mode: kernel, use_text: true, condition_on_speaker: true, k_tokens: 4, text_dim: 64,
         align: greedy, hidden: 96, history: 8, pos_weight: 2.0, weight: 1.0,
         act_columns: 4, duration_feats: true, dur_max: 64,
         future_act_aux: {horizons: [6, 12, 25], weight: 0.3},
         from_layers: [3, 4, 5, 6, 7, 8, 9, 10, 11]}
data:
  mix:
    - {name: ami_turn, ami: {mode: turn, window_sec: 20, lead_sec: 4.0, trail_sec: 6.0,
                             ext_tracks: {source: stream, fallback: null, require: true}},
       weight: 1.0}
    - {name: conv, synthetic: {kind: conversation, preset: default, n_train: 2500}, weight: 0.3,
       drop_keys: [speaker]}
  val: {ami: {mode: turn, val_split: dev, n_val: 64}}
  derive: [vad, eou]
  batching: source
seed: 0
trainer:
  device: mps
  batch_size: 6
  lr: 1.0e-3
  warmup_steps: 100
  max_steps: 2000
  log_every: 50
  conditioning: {p_ext: 0.9, p_diar: 0, flip: 0.01,
                 ext_noise: {p: 0.3, swap_max: 12, drop: 0.2, drop_max: 4, at_turn_end: 0.5}}
