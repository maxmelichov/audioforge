# Distil NVIDIA's diarizer into our head on the frozen served encoder.
# Teacher: Nemotron-3-Diarization (max pool, all 8 columns) offline posteriors on the AMI + ICSI train diar windows
# (16 s), cached once by a research driver (not published) -> data/cache/diar_teacher/{ami,icsi}_train.npz
# (symlinked to the SSD). Student: the stage-1 Sortformer head (4 columns, 1.9 M) on one encoder tap; the loss is
# (1 - w) * (PIL + sorted BCE vs the labels) + w * (the same vs the teacher's posteriors, sorted by arrival, cropped to
# 4 columns), w = 0.5. Variants (overrides): heads.diar.from_layers=[5] (block 6, the layer-routing
# study's best single tap) and heads.diar.from_layers=[3,5] (learned 2-block mix). Head only (init.train_only), MPS.
# Trained by a research driver (not published), output <ssd>/diar_distill_b6.afm.
name: diar_distill_nemotron3
init: {from: runs/stage1_served.afm, pretrained_lr_mult: 0, train_only: [heads.diar, layer_mix.diar]}
heads:
  rnnt: {weight: 0}
  ctc: {weight: 0}
  vad: {weight: 0}
  eou: {weight: 0}
  spk: {weight: 0}
  turn: {weight: 0}
  diar: {type: sortformer, num_spks: 4, from_layers: [5], prefix_prob: 0.5, prefix_min: 8, weight: 1.0,
         distill: {key: diar_teacher, weight: 0.5}}
data:
  mix:
    - {name: ami_diar, ami: {mode: diar, window_sec: 16}, weight: 1.0,
       spk_teacher: {file: "data/cache/diar_teacher/ami_{split}.npz", key: diar_teacher, missing: drop}}
    - {name: icsi_diar, icsi: {mode: diar, window_sec: 16}, weight: 1.0,
       spk_teacher: {file: "data/cache/diar_teacher/icsi_{split}.npz", key: diar_teacher, missing: drop}}
  val: {ami: {mode: diar, val_split: dev, n_val: 16}}
  derive: [vad, eou]
  batching: source
seed: 0
trainer:
  device: mps
  batch_size: 6
  lr: 1.0e-3
  warmup_steps: 100
  max_steps: 1000
  log_every: 50
