# PLAN.md §2 R2 stage 2 / §4 row 8: gentle unfreeze of the stage-1 model. Backbone + ASR heads train at
# lr x 0.05 (init.pretrained_scope); the stage-1 heads, speaker kernels and layer mixes stay at full lr.
# Forgetting guards: KL anchor to the frozen starting RNNT (weight 0.5) and mode-consistency KL between
# 1.04 s and 80 ms lookahead ([70,13] vs [70,1]; also trains the second mode). WER gate: stop and restore
# the last checkpoint if LibriSpeech WER rises > 0.2 points (0.002) over the step-0 baseline.
# Caveat: the synthetic conversations' transcripts are English words rendered as tones; in this stage
# the RNNT/CTC also learn from them (the anchor and gate bound the damage; drop conv's weight if
# the gate trips early).
#
# Run after stage 1 (MPS, one job on the machine, ~1 h):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.5 .venv/bin/python -m audioforge.cli train recipes/stage2_unfreeze_pretrained.yaml \
#     -o runs/stage2_unfreeze_pretrained.afm 2>&1 | tee runs/stage2_unfreeze_pretrained.log
# Memory estimate (batch 8, <= 20 s): full encoder grads + AdamW state (~1.4 GB), activations for up to
# four encoder passes (plain [70,13], speaker-conditioned, MCR [70,1], no-grad teacher) ~8-12 GB peak;
# lower trainer.batch_size to 4 if MPS runs out.
name: stage2_unfreeze_pretrained
init:
  trainable_encoder_layers: [11, 12, 13, 14, 15, 16]  # top 6 of 17: full unfreeze OOMs on this Mac (10.7 GB at batch 4)
  from: runs/stage1_heads_pretrained.afm
  pretrained_lr_mult: 0.05
  pretrained_scope: [encoder.pre_encode., encoder.layers., heads.rnnt., heads.ctc.]
encoder: {speaker_kernel_layers: [0, 2]}
heads:
  # explicit weights: stage 1 saved rnnt/ctc with weight 0 and init.from merges its head configs.
  # RNNT keeps training (the KL anchor and MCR need its joint); CTC only as a light auxiliary.
  rnnt: {fused_batch_size: 2, weight: 1.0}
  ctc: {weight: 0.1}
  vad: {type: frame, key: vad, hidden: 64, from_layers: all, weight: 0.5}
  eou: {type: frame, key: eou, hidden: 64, pos_weight: 5.0, weight: 0.5}
  spk: {type: speaker, num_speakers: 190, from_layers: all, weight: 0.3}
  diar: {type: sortformer, num_spks: 4, weight: 0.5}
  turn: {type: turn, mode: kernel, use_text: true, condition_on_speaker: true, k_tokens: 4, text_dim: 64,
         align: greedy, hidden: 96, history: 8, pos_weight: 2.0, weight: 1.0}
data:
  mix:
    - {name: conv, synthetic: {kind: conversation, preset: default, n_train: 2500}, weight: 1.0,
       drop_keys: [speaker, text, source_text]}  # tone-language 'transcripts' must not train the ASR heads (WER 2.1->8.2% in 500 steps when they did)
    - {name: ami_turn, ami: {mode: turn, window_sec: 16}, weight: 1.0}
    - {name: ami_diar, ami: {mode: diar, window_sec: 16}, weight: 1.0}
  val: {ami: {mode: turn, val_split: dev, n_val: 64}}
  derive: [vad, eou]
  batching: source
  # AMI windows capped at 16 s (T <= 200) instead of 20 s: fewer frames per lattice. NB the turn windows'
  # text is the whole turn even when the window clips its start (datasets/ami.py turn_examples), so
  # U can still reach ~1.6k tokens for a long monologue; that needs a crop there, not here.
trainer:
  device: mps
  # 6 (was 8): the speaker-conditioned encoder pass keeps activations for all items; with fused_batch_size 2
  # the RNNT joint peak is set by the sub-batch, not by this value (see tests/test_mem.py for the arithmetic)
  batch_size: 3  # 4 still OOMs (~10.5 GB) around step 300 on this Mac; 3 with watermark 0.7
  lr: 3.0e-4
  warmup_steps: 100
  max_steps: 2000
  log_every: 50
  checkpoint_every: 250  # must be <= wer_gate.every so a good checkpoint exists when the gate trips
  anchor: {weight: 1.0, heads: [rnnt]}
  # mode_consistency (third encoder pass with grad) is off on this 24 GB Mac: OOM at batch 6 even at 8.9 GB.
  # Re-enable on a GPU with >= 16 GB: mode_consistency_disabled: {weight: 0.3, contexts: [[70, 13], [70, 1]], heads: [rnnt]}
  wer_gate: {manifest: data/librispeech/test-clean-first200.jsonl, n: 100, every: 250, max_delta: 0.002,
             head: rnnt}
