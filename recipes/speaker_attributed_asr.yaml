# NEW SOLUTION: diarization + multitalker ASR in ONE model.
# NVIDIA's multitalker-parakeet needs a separate Sortformer model for speaker activity, then
# injects "speaker kernels" into its own FastConformer. Both are FastConformer-based, so here a
# single encoder carries a Sortformer head, and its activity output steers the same encoder
# (speaker kernels at layers 0 and 2) for per-speaker transcription.
name: speaker_attributed_asr_tiny
preprocessor: {n_mels: 80}
encoder: {d_model: 144, n_layers: 4, n_heads: 4, subsampling_channels: 64, speaker_kernel_layers: [0, 2]}
tokenizer: {kind: char}
heads:
  diar: {type: sortformer, num_spks: 4, d_hidden: 96, n_layers: 2, weight: 0.3}
  asr: {type: rnnt, pred_hidden: 160, joint_hidden: 160, condition_on_speaker: true, weight: 0.7}
decoding: {primary: asr}
data: {synthetic: {kind: speaker_attributed, n_train: 3000, n_val: 64}}
trainer: {max_steps: 2000, batch_size: 16, lr: 1.5e-3, warmup_steps: 150, log_every: 50}
