# Stage 1d (b) = (a) + a causal standardised log-RMS frame energy input (one scalar per 80 ms frame of the raw mixed audio the model hears; heads/turn.py energy_features), entering through its own zero-initialised projection so step 0 equals (a)'s start.
# Everything else is recipes/stage1_turn_dyadic.yaml (a):
# the trail6 turn head continued on REAL DYADIC audio: otoSpeech-141h
# (CC BY 4.0, two channels, one party each) with column 0 = the window's party (the "user"), column 1 = the OTHER
# party's exact activity (the agent: a product knows its own TTS timeline), plus AMI turn
# windows with their cached streaming Sortformer tracks (so the head keeps working on diarizer input) and the
# synthetic four-move conversations. Encoder, ASR and every other head frozen (pretrained_lr_mult 0): heads.turn only.
#
# Data (datasets/dyadic.py): the first 160 conversations of the downloaded slice (23 shards, 204 conversations),
# split by conversation: dev = positions i with i % 8 in {0, 1, 2} (60 conversations), train = the other 100
# (~25 h). Party activity = Silero VAD v5 per channel (no transcripts on oto), turns by our floor definition, both
# parties' turns (roles: null) so every window has an exact agent column; speaker ids dropped (the oto licence forbids
# speaker identification). Windows over redacted segments are excluded. Text: oto has no transcripts, so each
# window's text is the frozen ASR's greedy decode of its party's own channel (asr_text),
# the AMI convention (the primary's words) with the ASR hypothesis as the transcript.
#
# Conditioning = trail6's (p_ext 0.9 on AMI items with a cached streaming track + ext_noise; dyadic / synthetic items
# have no ext track, so their track is the oracle party activity with 1 % frame flips and their agent column stays
# exact) plus corrupted-then-corrected windows (model.py rebind): with p 0.1 per
# item the final track binds the wrong party (primary column swapped with the most active other column) for 1-4 s
# ending between the onset and the turn end, then is correct again; the EOT labels stay the clean ones.
#
# Prerequisites (CPU / MPS, resumable, numbers from the 2026-09-26 build), run by research drivers (not published):
#   oto Silero labels + float16 mix caches for the 160 conversations (2 parallel parts, 4.5 GB: ~8 min)
#   the asr_text greedy decodes (MPS, resumable, ~20 min)
#   AMI train_trail6 streaming tracks as recipes/stage1_turn_v3_trail6.yaml (already cached).
# Run (GPU, ~30 min on MPS):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.6 PYTORCH_MPS_LOW_WATERMARK_RATIO=0.5 .venv/bin/python -m audioforge.cli train \
#       recipes/stage1_turn_dyadic_energy.yaml -o runs/stage1_turn_dyadic_energy.afm 2>&1 | tee runs/stage1_turn_dyadic_energy.log
# Variants: stage1_turn_dyadic_energy.yaml (b), stage1_turn_dyadic_mh.yaml (c), stage1_turn_dyadic_energy_mh.yaml (d).
name: stage1_turn_dyadic_energy
init:
  from: runs/stage1_turn_v3_trail6.afm  # warm start: the AMI-trained trail6 head (160 ms model, att_context_size [70, 1])
  pretrained_lr_mult: 0
  pretrained_scope: [preprocessor., encoder., layer_mix., heads.rnnt., heads.ctc., heads.vad., heads.eou.,
                     heads.spk., heads.diar.]
encoder: {att_context_size: [70, 1], att_context_sizes: [[70, 1]], speaker_kernel_layers: [0, 2]}
heads:
  diar: {weight: 0}
  turn: {type: turn, mode: kernel, use_text: true, condition_on_speaker: true, k_tokens: 4, text_dim: 64,
         align: greedy, hidden: 96, history: 8, pos_weight: 2.0, weight: 1.0,
         act_columns: 4, duration_feats: true, dur_max: 64,
         energy_input: {tau_frames: 125, clip: 4.0},
         future_act_aux: {horizons: [6, 12, 25], weight: 0.3}}
data:
  mix:
    - {name: oto_turn, dyadic: {corpus: oto, mode: turn, n_conv: 160, split_mod: 8, dev_res: [0, 1, 2], roles: null,
                                agent_rule: second, activity_source: silero, cache_dtype: float16, asr_text: true,
                                window_sec: 20, lead_sec: 4.0, trail_sec: 6.0, min_trail: 1.0},
       weight: 1.0, drop_keys: [speaker]}
    - {name: ami_turn, ami: {mode: turn, window_sec: 20, lead_sec: 4.0, trail_sec: 6.0,
                             ext_tracks: {source: stream, fallback: null, require: true}},
       weight: 0.5}
    - {name: conv, synthetic: {kind: conversation, preset: default, n_train: 2500}, weight: 0.3,
       drop_keys: [speaker]}
  val: {dyadic: {corpus: oto, mode: turn, n_conv: 160, split_mod: 8, dev_res: [0, 1, 2], roles: [human],
                 trail_sec: 2.0, n_val: 48, cache_dtype: float16}}
  derive: [vad, eou]
  batching: source
trainer:
  device: auto
  batch_size: 6
  lr: 5.0e-4
  warmup_steps: 100
  max_steps: 3000
  log_every: 50
  checkpoint_every: 500
  checkpoint_keep: 1  # 443 MB per .afm on a nearly full disk: keep only the newest step checkpoint
  # model conditioning (trainer.conditioning: the location that survives init.from; see audioforge/model.py)
  conditioning: {p_ext: 0.9, p_diar: 0, flip: 0.01,
                 ext_noise: {p: 0.3, swap_max: 12, drop: 0.2, drop_max: 4, at_turn_end: 0.5},
                 rebind: {p: 0.1, w_min: 12, w_max: 50}}
  # no WER gate: the encoder and the RNNT head are frozen (lr x0); the run asserts their tensors unchanged instead
  # (checked by a research driver, not published)
