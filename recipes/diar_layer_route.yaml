# Layer routing, part 1: which encoder block should the diarization head read?
# The served diar head (runs/stage1_served.afm) reads a near-uniform learned mix of all 17 blocks; the speaker-head
# study found speaker identity in blocks 1-9 and chance from block 10 up. This recipe is the CONTROL
# (from_layers: all, the stage-1 mix re-trained on identical data/steps); the taps are the same recipe with one
# override:
#   heads.diar.from_layers=[1]   block 2      heads.diar.from_layers=[3]   block 4      heads.diar.from_layers=[5]  block 6
#   heads.diar.from_layers=[7]   block 8      heads.diar.from_layers=[11]  block 12
#   heads.diar.from_layers=[0,1,2,3,4,5,6,7,8]   learned mix restricted to blocks 1-9 (fresh uniform mix)
# Head only: init.train_only freezes everything but heads.diar / layer_mix.diar; the head is warm-started from the
# served stage-1 diar head in every variant (the control keeps its mix too; a changed tap drops / re-inits the mix).
# Same data and objective as stage 1's diar head (recipes/stage1_heads_pretrained.yaml): Sortformer PIL+BCE with the
# prefix loss, the synthetic conversations + AMI turn windows + AMI diar windows mix (16 s), single-source batches.
# The other heads have weight 0 (no RNNT joint, no speaker-conditioned second encoder pass); no conditioning.
#
# GPU (one job on the machine; ~8 min):
#   trained by a research driver (not published), one run per variant, e.g. heads.diar.from_layers=[3]
name: diar_layer_route
init: {from: runs/stage1_served.afm, pretrained_lr_mult: 0, train_only: [heads.diar, layer_mix.diar]}
heads:
  rnnt: {weight: 0}
  ctc: {weight: 0}
  vad: {weight: 0}
  eou: {weight: 0}
  spk: {weight: 0}
  turn: {weight: 0}
  diar: {type: sortformer, num_spks: 4, from_layers: all, prefix_prob: 0.5, prefix_min: 8, weight: 1.0}
data:
  mix:
    - {name: conv, synthetic: {kind: conversation, preset: default, n_train: 2500}, weight: 1.0, drop_keys: [speaker]}
    - {name: ami_turn, ami: {mode: turn, window_sec: 16}, weight: 1.0}
    - {name: ami_diar, ami: {mode: diar, window_sec: 16}, weight: 1.0}
  val: {ami: {mode: diar, val_split: dev, n_val: 16}}
  derive: [vad, eou]
  batching: source
seed: 0
trainer:
  device: mps
  batch_size: 6
  lr: 1.0e-3
  warmup_steps: 100
  max_steps: 1000
  log_every: 50
