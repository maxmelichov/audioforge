# REPRODUCE: cache-aware streaming RNNT (nemotron-speech-streaming-en-0.6b, parakeet-unified-en-0.6b,
# stt_en_fastconformer_hybrid_large_streaming_multi). Causal subsampling + causal convs, chunked
# attention, several lookaheads trained jointly so one model serves 80 ms .. 1.1 s latency and offline.
# Production: 24 layers, d_model 1024, att_context_sizes [[70,0],[70,1],[70,6],[70,13]].
name: streaming_rnnt_tiny
preprocessor: {n_mels: 80, normalize: fixed}  # global stats: streaming-safe
spec_augment: {freq_masks: 2, freq_width: 15, time_masks: 2, time_width: 0.05}
encoder:
  d_model: 144
  n_layers: 4
  n_heads: 4
  subsampling_channels: 64
  causal: true
  att_context_size: [16, 1]            # default inference latency: 2 x 80 ms chunks
  att_context_sizes: [[16, 1], [16, 0], [16, 3], [-1, -1]]
tokenizer: {kind: char}
heads:
  rnnt: {type: rnnt, pred_hidden: 160, joint_hidden: 160, weight: 0.7}
  ctc: {type: ctc, weight: 0.3}
data: {synthetic: {kind: asr, n_train: 3000, n_val: 64}}
trainer: {max_steps: 2000, batch_size: 16, lr: 2.0e-3, warmup_steps: 150, log_every: 50}
