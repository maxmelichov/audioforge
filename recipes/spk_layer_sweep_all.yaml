# Speaker-head layer sweep: is the speaker head's 32 % within-meeting EER the frozen encoder's
# features or the supervision? This run keeps the stage-1 objective (AAM-softmax with 190 output classes; the 45 AMI train
# speakers' single-speaker segments are the only labelled data) and keeps the stage-1 learned softmax mix over all 17 layers (from_layers: all, initialised from
# stage 1's near-uniform mix and trained): the control that separates the data change (segments instead of 16 s turn windows) from the layer. Head only: everything but heads.spk is frozen and
# the RNNT / CTC / other heads are untouched (the training driver asserts their tensors are bit-identical).
#
# GPU (one job on the machine), trained by a research driver (not published).
name: spk_layer_sweep_Lall
init: {from: runs/stage1_heads_pretrained.afm, pretrained_lr_mult: 0, train_only: [heads.spk, layer_mix.spk]}
heads:
  # frozen and skipped (weight 0): no RNNT joint, no second speaker-conditioned encoder pass
  rnnt: {weight: 0}
  ctc: {weight: 0}
  vad: {weight: 0}
  eou: {weight: 0}
  diar: {weight: 0}
  turn: {weight: 0}
  spk: {type: speaker, num_speakers: 190, from_layers: all, weight: 1.0}
data:
  # AMI train single-speaker segments (asr mode: 930 segments, 45 speakers, 1.8 h); val = AMI dev segments
  ami: {mode: asr, val_split: dev, n_val: 64}
trainer:
  device: mps
  batch_size: 6
  lr: 1.0e-3
  warmup_steps: 100
  max_steps: 1000
  log_every: 50
