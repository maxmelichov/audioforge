<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.te { position: absolute; line-height: 1.2; }
.zh .num { display: inline-block; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0B0B0C; font-weight: 700; font-size: 28px; text-align: center; line-height: 46px; margin-right: 14px; vertical-align: middle; }
.zh .h { font-size: 34px; font-weight: 700; vertical-align: middle; white-space: nowrap; }
.zh .c { font-size: 26px; color: #C7C7CC; margin-top: 8px; }
.pill { border-radius: 22px; background: #FF7A1A; color: #0B0B0C; padding: 16px 24px; }
.pill .q { font-size: 30px; font-weight: 700; } .pill .a { font-size: 26px; margin-top: 4px; }
.gbox { border-radius: 22px; background: #141416; border: 2px solid #636366; padding: 18px 24px; }
.gbox .n { font-size: 30px; font-weight: 700; } .gbox .s { font-size: 26px; color: #C7C7CC; margin-top: 4px; }
.small { font-size: 26px; color: #C7C7CC; }
</style></head><body><div id="stage"></div><script>
// Plain-language architecture image: (1) Listen: NVIDIA's frozen streaming speech model turns audio into words as you
// speak; (2) three small heads answer three questions; (3) two NVIDIA helpers. Facts and engineering details in a
// strip and one footnote. Sources: runs/stage1_served.afm, research/archive/SPK_HEAD.md, research/archive/PERFORMANCE.md.
const lines = [];
function te(cls, html, r) { const e = document.createElement("div"); e.className = "te " + cls; e.dataset.te = "1"; e.innerHTML = html;
  e.style.left = r[0] + "px"; e.style.top = r[1] + "px"; if (r[2]) e.style.width = r[2] + "px"; if (r[3]) e.style.height = r[3] + "px"; document.getElementById("stage").appendChild(e); return e; }
function shape(css) { const e = document.createElement("div"); e.style.position = "absolute"; for (const k in css) e.style[k] = typeof css[k] === "number" ? css[k] + "px" : css[k]; document.getElementById("stage").appendChild(e); return e; }
function ln(x1, y1, x2, y2, col = "#8E8E93", w = 3, dash) { lines.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash ? ' stroke-dasharray="8 8"' : ""}/>`); }
function arr(x1, y1, x2, y2, col = "#8E8E93") { ln(x1, y1, x2, y2, col); const a = Math.atan2(y2 - y1, x2 - x1), s = 13;
  lines.push(`<path d="M${x2} ${y2} L${x2 - s * Math.cos(a - 0.45)} ${y2 - s * Math.sin(a - 0.45)} L${x2 - s * Math.cos(a + 0.45)} ${y2 - s * Math.sin(a + 0.45)} Z" fill="${col}"/>`); }
function wave(x, y, w, h) { const n = 11, vals = [0.3, 0.6, 0.9, 0.5, 1, 0.7, 0.4, 0.8, 0.55, 0.35, 0.2];
  for (let i = 0; i < n; i++) { const bh = h * vals[i]; shape({ left: x + i * w / n + w / n * 0.25, top: y + (h - bh) / 2, width: w / n * 0.5, height: bh, background: "#FFFFFF", borderRadius: "5px" }); } }
function build(W, H) {
  const st = document.getElementById("stage"); Object.assign(st.style, { position: "relative", width: W + "px", height: H + "px", background: "#0B0B0C" });
  const M = 64, sq = H / W > 0.9;
  const Z = n => `<span class="num">${n}</span>`;
  if (!sq) {
    // today inset (top right)
    te("gbox", `<div class="s" style="margin:0">Today: Silero VAD → turn detector → Whisper, one model per question</div>`, [W - M - 1010, M, 1010]).style.borderStyle = "dashed";
    // zone headers
    te("zh", `${Z(1)}<span class="h">Listen</span><div class="c">NVIDIA's model turns your voice into words as you speak</div>`, [M, 170, 820]);
    te("zh", `${Z(2)}<span class="h">Three small heads answer three questions</span><div class="c">three tiny heads on the same model, no separate models for these questions</div>`, [M + 900, 170, 880]);
    // zone 1: audio -> model block -> words
    wave(M, 440, 150, 150);
    const blk = [M + 190, 350, 400, 330];
    te("gbox", `<div class="n" style="font-size:34px">NVIDIA streaming speech model</div><div class="s">17 layers · frozen</div>`, blk).style.display = "flex";
    Object.assign(document.querySelectorAll(".te")[3].style, { flexDirection: "column", justifyContent: "flex-start" });
    for (let k = 0; k < 17; k++) shape({ left: blk[0] + 24, top: blk[1] + 150 + k * 9, width: blk[2] - 48, height: 5, background: k === 3 ? "#FFFFFF" : "#3A3A3C", borderRadius: "3px" });
    arr(M + 156, 515, blk[0] - 8, 515);
    te("small", "words while you speak", [blk[0] + 150, 296, 330]);
    arr(blk[0] + 120, blk[1] - 4, blk[0] + 140, 314);
    // layer-4 mark (the 4th thin layer from the top is layer 4 of 17)
    const l4y = blk[1] + 150 + 3 * 9 + 2;
    // zone 2: three orange pills
    const px = M + 900, pw = 500, ph = 104, pys = [320, 450, 580];
    const P = [["Is someone speaking?", "→ yes"], ["Who is speaking?", "→ Person 2"], ["Is the turn over?", "→ not yet"]];
    P.forEach(([q, a], i) => te("pill", `<div class="q">${q}</div><div class="a">${a}</div>`, [px, pys[i], pw, ph]));
    // connectors from the model to the pills
    ln(blk[0] + blk[2], blk[1] + 60, px - 4, pys[0] + ph / 2, "#FF7A1A", 3);
    ln(blk[0] + blk[2] - 24, l4y, px - 4, pys[1] + ph / 2, "#FF7A1A", 3);
    te("small", "reads layer 4 of 17", [blk[0] + blk[2] + 30, l4y + 30, 260]);
    // loop for the turn pill: a second pass through the model, told who is speaking
    lines.push(`<path d="M${px - 4} ${pys[2] + ph / 2} C ${px - 140} ${pys[2] + ph / 2}, ${px - 150} ${blk[1] + blk[3] + 40}, ${blk[0] + blk[2] / 2} ${blk[1] + blk[3] + 40} L ${blk[0] + blk[2] / 2} ${blk[1] + blk[3] + 8}" fill="none" stroke="#FF7A1A" stroke-width="3" stroke-dasharray="8 8"/>`);
    te("small", "second pass, told who is speaking", [blk[0] + 20, blk[1] + blk[3] + 54, 520]);
    // zone 3: helpers
    te("zh", `${Z(3)}<span class="h" style="font-size:30px">Two NVIDIA helpers</span><div class="gbox" style="margin-top:14px"><div class="n">Nemotron-3</div><div class="s">who is in the room</div></div><div class="gbox" style="margin-top:14px"><div class="n">Parakeet</div><div class="s">rewrites each finished sentence</div></div>`, [px + pw + 40, 320, W - M - (px + pw + 40)]);
    // why it matters
    te("gbox", `<div class="s" style="margin:0;color:#FFFFFF;font-size:26px"><b>Why it matters:</b> speaker head reads layer 4, not all 17: errors 32 % → 14 %&nbsp;&nbsp;·&nbsp;&nbsp;only the new 160 ms is computed, the last 5.6 s are cached&nbsp;&nbsp;·&nbsp;&nbsp;<b style="color:#FF7A1A">same answers, 38 % less compute</b></div>`, [M, 800, W - 2 * M]);
    te("foot", `For engineers: FastConformer, 109 M encoder, cache-aware (70 frames), log-mel 80 bins, ×8 subsampling, RNNT decoder · heads 33 K / 0.5 M / 0.32 M (GRU) · turn pass conditioned at blocks 1 and 3 · column-major weights, cached projections and RNNT joint`, [M, H - M - 64, W - 2 * M]).style.fontSize = "24px";
  } else {
    te("gbox", `<div class="s" style="margin:0">Today: Silero VAD → turn detector → Whisper, one model per question</div>`, [M, M, W - 2 * M]).style.borderStyle = "dashed";
    te("zh", `${Z(1)}<span class="h">Listen</span><div class="c">NVIDIA's model turns your voice into words as you speak</div>`, [M, 170, W - 2 * M]);
    wave(M, 312, 90, 110);
    const blk = [M + 120, 290, 380, 150];
    te("gbox", `<div class="n" style="font-size:28px">NVIDIA streaming speech model</div><div class="s">17 layers · frozen</div>`, blk);
    arr(M + 94, 367, blk[0] - 8, 367);
    arr(blk[0] + blk[2] + 8, 367, blk[0] + blk[2] + 40, 367);
    te("small", "words while<br>you speak", [blk[0] + blk[2] + 50, 330, 240]);
    te("zh", `${Z(2)}<span class="h">Three small heads</span><div class="c">three tiny heads on the same model, no separate models for these questions</div>`, [M, 470, W - 2 * M]);
    const P = [["Is someone speaking?", "→ yes"], ["Who is speaking?", "→ Person 2 · reads layer 4 of 17"], ["Is the turn over?", "→ not yet · second pass, told who is speaking"]];
    P.forEach(([q, a], i) => te("pill", `<div class="q" style="font-size:26px">${q}</div><div class="a" style="font-size:24px">${a}</div>`, [M, 590 + i * 86, W - 2 * M - 310, 76]).style.padding = "8px 20px");
    te("zh", `${Z(3)}<span class="h" style="font-size:28px">NVIDIA helpers</span><div class="c" style="font-size:24px">Nemotron-3: who is in the room<br><br>Parakeet: rewrites each finished sentence</div>`, [W - M - 290, 590, 290]);
    te("gbox", `<div class="s" style="margin:0;color:#FFFFFF;font-size:24px">Layer 4, not all 17: speaker errors 32 % → 14 % · only the new 160 ms is computed, the last 5.6 s are cached · <b style="color:#FF7A1A">same answers, 38 % less compute</b></div>`, [M, 848, W - 2 * M]).style.padding = "12px 20px";
    te("foot", `For engineers: FastConformer 109 M, cache-aware, log-mel 80, ×8 subsampling, RNNT · heads 33 K / 0.5 M / 0.32 M GRU`, [M, H - M - 60, W - 2 * M]).style.fontSize = "24px";
  }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", W); svg.setAttribute("height", H); svg.innerHTML = lines.join(""); st.appendChild(svg);
}
window.build = build;
</script></body></html>
