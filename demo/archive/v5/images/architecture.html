<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body><div id="stage"></div><script>
// Static architecture image of the served model (sizes and taps: runs/stage1_served.afm, audioforge/modules/
// fastconformer.py, heads/turn.py, serve.py; speaker result: research/archive/SPK_HEAD.md; engineering: research/archive/PERFORMANCE.md).
// build(W, H, data): 1920x1080 or 1080x1080 CSS px; render_images.py screenshots it at 2x.
const lines = [];
function el(cls, html, css) { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; for (const k in css) e.style[k] = typeof css[k] === "number" ? css[k] + "px" : css[k]; document.getElementById("stage").appendChild(e); return e; }
function ln(x1, y1, x2, y2, col = "#636366", w = 3) { lines.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`); }
function arr(x1, y1, x2, y2, col = "#636366") { ln(x1, y1, x2, y2, col); const a = Math.atan2(y2 - y1, x2 - x1), s = 10;
  lines.push(`<path d="M${x2} ${y2} L${x2 - s * Math.cos(a - 0.45)} ${y2 - s * Math.sin(a - 0.45)} L${x2 - s * Math.cos(a + 0.45)} ${y2 - s * Math.sin(a + 0.45)} Z" fill="${col}"/>`); }
function bars(x, y, w, h, n, col) { const bw = w / (n * 1.55), g = (w - n * bw) / (n - 1), xs = [];
  for (let k = 0; k < n; k++) { const bx = x + k * (bw + g); el("abs", "", { left: bx, top: y, width: bw, height: h, background: col, borderRadius: "3px" }); xs.push(bx + bw / 2); } return xs; }
function box(cls, n, q, r, fs = 28, qs = 22) { return el("box " + cls, `<div class="n" style="font-size:${fs}px">${n}</div>${q ? `<div class="q" style="font-size:${qs}px">${q}</div>` : ""}`, { left: r[0], top: r[1], width: r[2], height: r[3] }); }
function lab(html, x, y, css = {}) { return el("abs", html, Object.assign({ left: x, top: y, fontSize: 24, lineHeight: "1.2", color: "#FFFFFF", whiteSpace: "nowrap" }, css)); }
function build(W, H, D) {
  const st = document.getElementById("stage"); st.style.position = "relative"; st.style.width = W + "px"; st.style.height = H + "px"; st.style.background = "#0B0B0C";
  const sq = H / W > 0.9, M = 64;
  const G = !sq ? {
    title: [M, M], inset: [W - M - 520, M, 520, 104],
    wave: [M, 250, 170, 170], mel: [M + 200, 250, 150, 170], sub: [M + 380, 250, 120, 170], s1: [M + 540, 230, 470, 210],
    rnnt: [M + 1050, 280, 190, 110], words: [M + 1280, 270, 510, 150],
    spk: [M + 500, 540, 320, 118], vad: [M + 850, 540, 330, 118], tdt: [M + 1280, 540, 400, 118],
    dz: [M, 700, 330, 118], s2: [M + 380, 704, 400, 110], turn: [M + 870, 696, 250, 126], meter: [M + 1150, 700, 300, 118],
    eng: [M, 880, W - 2 * M, 64], foot: [M, H - M - 30],
  } : {
    title: [M, M], inset: [M, 124, W - 2 * M, 64],
    wave: [M, 276, 110, 126], mel: [M + 126, 276, 100, 126], sub: [M + 242, 276, 84, 126], s1: [M + 344, 276, 330, 126],
    rnnt: [M + 690, 290, 262, 90], words: [M + 690, 412, 262, 110],
    spk: [M, 470, 300, 110], vad: [M + 316, 470, 300, 110], tdt: [M + 690, 560, 262, 110],
    dz: [M, 700, 272, 110], s2: [M + 290, 704, 270, 102], turn: [M + 580, 696, 190, 118], meter: [M + 790, 700, 162, 118],
    eng: [M, 838, W - 2 * M, 104], foot: [M, H - M - 30],
  };
  // title + today inset
  lab(`<span style="font-weight:700;font-size:${sq ? 38 : 42}px"><span style="color:#FF7A1A">audioforge</span>: small heads on NVIDIA's ${sq ? "" : "streaming "}speech model</span>`, G.title[0], G.title[1], { whiteSpace: sq ? "normal" : "nowrap", width: sq ? W - 2 * M : undefined });
  lab(`<span style="font-size:${sq ? 22 : 26}px;color:#A1A1A6">NVIDIA's frozen model writes the words; three small heads answer: speaking? who? turn over?</span>`, G.title[0], G.title[1] + (sq ? 48 : 60), { display: sq ? "none" : "block" });
  const ins = el("box grey", sq ? `<div style="font-size:22px;color:#C7C7CC"><span style="color:#A1A1A6">today:</span> Silero VAD → turn detector → Whisper, one model per question</div>` : `<div class="q" style="font-size:22px;margin:0;color:#A1A1A6">today</div><div style="font-size:24px;color:#C7C7CC;margin-top:4px">Silero VAD → turn detector → Whisper: a separate model per question</div>`, { left: G.inset[0], top: G.inset[1], width: G.inset[2], height: G.inset[3], borderStyle: "dashed", background: "transparent" });
  // row 1: the NVIDIA speech model
  const fs = sq ? 24 : 26;
  lab(`audio<br><span style="color:#A1A1A6">${sq ? "160 ms" : "160 ms chunks"}</span>`, G.wave[0], G.wave[1] - 64, { fontSize: fs - 2 });
  const env = D.env, nb = sq ? 12 : 16, wb = G.wave[2] / nb;
  for (let i = 0; i < nb; i++) { let m = 0; for (let k = 0; k < 20; k++) m = Math.max(m, env[4000 + i * 20 + k] || 0); const h = Math.max(8, Math.pow(m, 0.7) * G.wave[3] * 0.9);
    el("abs", "", { left: G.wave[0] + i * wb + wb * 0.25, top: G.wave[1] + G.wave[3] / 2 - h / 2, width: wb * 0.5, height: h, background: "#FFFFFF", borderRadius: "4px" }); }
  lab(`log-mel<br><span style="color:#A1A1A6">80 bins</span>`, G.mel[0], G.mel[1] - 64, { fontSize: fs - 2 });
  const cv = document.createElement("canvas"); cv.width = 150; cv.height = 80; st.appendChild(cv); Object.assign(cv.style, { position: "absolute", left: G.mel[0] + "px", top: G.mel[1] + "px", width: G.mel[2] + "px", height: G.mel[3] + "px", borderRadius: "10px" });
  const g = cv.getContext("2d"), img = g.createImageData(150, 80), raw = atob(D.mel);
  for (let x = 0; x < 150; x++) for (let y = 0; y < 80; y++) { const i = (1500 + x) * 80 + (79 - y); const v = i < raw.length ? raw.charCodeAt(i) / 255 : 0; const c = Math.round(28 + 227 * v * v), o = (y * 150 + x) * 4; img.data[o] = img.data[o + 1] = img.data[o + 2] = c; img.data[o + 3] = 255; }
  g.putImageData(img, 0, 0);
  box("grey", "×8", "", G.sub, sq ? 26 : 30); lab(`sub-<br>sampling`, G.sub[0], G.sub[1] - 64, { fontSize: fs - 2 });
  const x1 = bars(G.s1[0], G.s1[1], G.s1[2], G.s1[3], 17, "#8E8E93");
  if (!sq) lab(`17 × FastConformer block <span style="color:#A1A1A6">· frozen · NVIDIA</span><br><span style="color:#A1A1A6">cache-aware: last 70 frames (5.6 s) cached · 80 ms lookahead</span>`, G.s1[0], G.s1[1] - 66, { fontSize: 24 });
  else lab(`17 × FastConformer <span style="color:#A1A1A6">· frozen</span><br><span style="color:#A1A1A6">5.6 s cached · 80 ms ahead</span>`, G.s1[0], G.s1[1] - 64, { fontSize: 22 });
  box("grey", "RNNT decoder", "", G.rnnt, sq ? 24 : 28);
  box("grey", "words while you speak", sq ? "" : "streaming RNNT output, every 160 ms", G.words, sq ? 22 : 26, 22).style.borderColor = "#8E8E93";
  const cy = r => r[1] + r[3] / 2, cx = r => r[0] + r[2] / 2;
  arr(G.wave[0] + G.wave[2] + 6, cy(G.wave), G.mel[0] - 6, cy(G.mel)); arr(G.mel[0] + G.mel[2] + 6, cy(G.mel), G.sub[0] - 6, cy(G.sub));
  arr(G.sub[0] + G.sub[2] + 6, cy(G.sub), G.s1[0] - 6, cy(G.s1)); arr(G.s1[0] + G.s1[2] + 6, cy(G.rnnt), G.rnnt[0] - 6, cy(G.rnnt));
  if (!sq) arr(G.rnnt[0] + G.rnnt[2] + 6, cy(G.rnnt), G.words[0] - 6, cy(G.rnnt)); else arr(cx(G.rnnt), G.rnnt[1] + G.rnnt[3] + 6, cx(G.rnnt), G.words[1] - 6);
  // row 2: our heads at their taps; Parakeet under the words
  const yb = G.s1[1] + G.s1[3] + (sq ? 4 : 64);
  box("ours", "Speaker head", `0.5 M · early tap at block 4`, G.spk, sq ? 24 : 28, 22);
  box("ours", "Speech head", `33 K · learned mix of all 17 blocks`, G.vad, sq ? 24 : 28, 22);
  ln(x1[3], G.s1[1] + G.s1[3] + 4, cx(G.spk), G.spk[1] - 4, "#FF7A1A", 3);
  for (const x of x1) ln(x, G.s1[1] + G.s1[3] + 4, cx(G.vad), G.vad[1] - 4, "#FF7A1A", 1.5);
  const sf = lab(`<span style="color:#A1A1A6">block 4, not all 17:</span><br><b>speaker errors 32 % → 14 %</b>`, sq ? G.spk[0] : M, sq ? G.spk[1] + G.spk[3] + 10 : G.spk[1] + 6, { fontSize: sq ? 22 : 26 });
  if (!sq) sf.style.left = M + "px";
  box("grey", "NVIDIA Parakeet", "rewrites each finished sentence", G.tdt, sq ? 24 : 28, 22);
  arr(cx(G.words), G.words[1] + G.words[3] + 6, cx(G.tdt), G.tdt[1] - 6);
  // row 3: diarizer -> second, speaker-conditioned pass -> turn head
  box("grey", "NVIDIA Nemotron-3", "who is in the room", G.dz, sq ? 24 : 28, 22).style.padding = sq ? "0 14px" : "0 20px";
  const x2 = bars(G.s2[0], G.s2[1], G.s2[2], G.s2[3], 17, "#8E8E93");
  lab(`<span style="color:#A1A1A6">${sq ? "second pass, told who is speaking" : "same encoder, second pass, told who is speaking (blocks 1 and 3)"}</span>`, G.s2[0], sq ? G.s2[1] - 36 : G.s2[1] + G.s2[3] + 10, { fontSize: 22, whiteSpace: "nowrap" });
  for (const k of [0, 2]) ln(G.dz[0] + G.dz[2] + 6, cy(G.dz) + (k ? 18 : -18), G.s2[0] - 8, cy(G.s2) + (k ? 18 : -18), "#8E8E93", 3);
  box("ours", "Turn head", "0.32 M · GRU", G.turn, sq ? 24 : 28, 22);
  arr(G.s2[0] + G.s2[2] + 6, cy(G.s2), G.turn[0] - 6, cy(G.s2), "#636366");
  lab("turn over?", G.meter[0], G.meter[1] + 4, { fontSize: sq ? 22 : 28, fontWeight: 700 });
  el("abs", "", { left: G.meter[0], top: G.meter[1] + G.meter[3] - 38, width: G.meter[2], height: 20, background: "#141416", borderRadius: "10px" });
  el("abs", "", { left: G.meter[0], top: G.meter[1] + G.meter[3] - 38, width: G.meter[2] * 0.93, height: 20, background: "#FF7A1A", borderRadius: "10px" });
  el("abs", "", { left: G.meter[0] + G.meter[2] * 0.88, top: G.meter[1] + G.meter[3] - 48, width: 4, height: 40, background: "#FFFFFF" });
  arr(G.turn[0] + G.turn[2] + 6, cy(G.turn), G.meter[0] - 6, cy(G.turn), "#FF7A1A");
  // the second pass reuses the first pass's subsampled frames
  ln(cx(G.sub), G.sub[1] + G.sub[3] + 6, cx(G.sub), sq ? 0 : G.s2[1] - 30, "#636366", sq ? 0 : 3);
  if (!sq) { ln(cx(G.sub), G.s2[1] - 30, G.s2[0] + 10, G.s2[1] - 30, "#636366"); arr(G.s2[0] + 10, G.s2[1] - 30, G.s2[0] + 10, G.s2[1] - 6); }
  // engineering strip
  el("box grey", sq ? `<div style="font-size:22px;color:#C7C7CC;line-height:1.3"><b style="color:#FFFFFF">Engineering:</b> cached position projections · column-major weights · shared subsampling · cached RNNT joint</div><div style="font-size:22px;font-weight:700;color:#FFFFFF;border-left:5px solid #FF7A1A;padding-left:12px;margin-top:6px">same decisions, 38 % less compute</div>` : `<div style="font-size:24px;color:#C7C7CC"><b style="color:#FFFFFF">Engineering:</b> cached position projections · column-major weights · shared subsampling · cached RNNT joint <b style="color:#FFFFFF;border-left:5px solid #FF7A1A;padding-left:12px;margin-left:8px">same decisions, 38 % less compute</b></div>`, { left: G.eng[0], top: G.eng[1], width: G.eng[2], height: G.eng[3], background: "#141416" });
  lab(`<span style="color:#A1A1A6">NVIDIA FastConformer streaming model, 109 M encoder, frozen · speaker error: within-meeting equal error rate on AMI meetings · compute: whole server, 0 decision changes</span>`, M, G.foot[1], { fontSize: 22, whiteSpace: sq ? "normal" : "nowrap", width: sq ? W - 2 * M : undefined, top: sq ? H - M - 56 : G.foot[1] });
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", W); svg.setAttribute("height", H); svg.innerHTML = lines.join(""); st.appendChild(svg);
}
window.build = build;
</script></body></html>
