<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.t { position: absolute; font-size: 96px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; color: var(--fg); }
.row { position: absolute; font-size: 48px; line-height: 1.2; color: var(--fg); white-space: nowrap; }
.row .k { color: var(--fg2); }

</style></head><body><script src="common.js"></script><script>
// Setup card before an example: the exact out-of-the-box stack of the framework (verified settings in the fine print)
// and what we change. params.title, params.rows = [[key, value]], params.swap.
let P, els = [];
function init(data, params, W, H) {
  P = params.params || params; const ct = stage(W, H);
  const M = S.M, fs = S.sq ? 44 : 60;

  const t = U.el("div", "t h1", ct, P.title); U.css(t, { left: M, top: 0, width: W - 2 * M, fontSize: S.sq ? 84 : 110 }); els.push([t, 0]);
  const nr = (P.rows || []).length, blockH = t.offsetHeight + (S.sq ? 60 : 80) + nr * fs * 1.6 + 30 + fs * 1.3;
  const y0 = M + Math.max(0, (S.bottom - M - blockH) / 2); t.style.top = y0 + "px";

  });
  const sw = U.el("div", "swap", ct, P.swap); sw.style.fontSize = (S.sq ? 50 : 72) + "px"; U.css(sw, { left: M, top: y + 30, width: W - 2 * M }); els.push([sw, 0.3 + 0.2 * (P.rows || []).length]);
}
function render(t, ctx) {

  els.forEach(([e, t0]) => { const a = t0 <= 0 ? 1 : U.ease(U.seg(t, t0, 0.3)); e.style.opacity = a.toFixed(3); });
