<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>svg text { font-family: var(--font); }</style></head><body><script src="common.js"></script><script src="../../../v5/shots/numbers_b.js"></script><script src="charts_b.js"></script><script>
// "Holds on meetings it never saw": ICSI held-out, AMI thresholds frozen (runs/baselines_turn_icsi_dyn.json via numbers_b.js).
// Headline: the caught ratio (export_b.py). Turn ends caught within the horizon and false cut-offs, one pair each. CIs and the policy name: fine print only.
const n = B.n, s = B.s, r = B.row;
const src = "runs/baselines_turn_icsi_dyn.json";
panelChart({
  title: () => `Catches ${s("icsi/caught_ratio")}× as many turn ends, with half the cut-offs`,
  sub: () => "On meetings it never saw · settings frozen from other meetings",
  subSq: () => "",
  panels: () => [
    { title: `Turn ends caught within ${n("icsi/horizon_s")} s`, unit: " %", weight: 3,
      rows: [r("audioforge", "icsi/ours/caught", { ours: true }), r("Silero silence timeout", "icsi/silero/caught")] },
    { title: "People cut off too early", unit: " %", weight: 3,
      rows: [r("audioforge", "icsi/ours/fc", { ours: true }), r("Silero silence timeout", "icsi/silero/fc")] },
  ],
  fine: () => `ICSI, ${n("icsi/meetings")} held-out meetings, ${n("icsi/n")} turns; thresholds fitted on ${n("icsi/ami_n")} AMI turns and frozen; audioforge = ${n("icsi/policy")},  caught 95 % CI [${n("icsi/ours/caught_ci").join(", ")}] vs [${n("icsi/silero/caught_ci").join(", ")}] %, paired difference [${n("icsi/diff_ci").join(", ")}] points · ${src}`,
  fineSq: () => `ICSI, ${n("icsi/meetings")} held-out meetings, ${n("icsi/n")} turns; thresholds frozen from ${n("icsi/ami_n")} AMI turns; audioforge = ${n("icsi/policy")}; caught 95 % CI [${n("icsi/ours/caught_ci").join(", ")}] vs [${n("icsi/silero/caught_ci").join(", ")}] % · ${src}`,
});
</script></body></html>
