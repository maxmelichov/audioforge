<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.card { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.big { font-weight: 700; letter-spacing: -0.03em; line-height: 1.0; white-space: nowrap; }
.big .pre { font-size: 0.4em; letter-spacing: 0; margin-right: 0.25em; }
.words { font-size: 72px; line-height: 1.15; font-weight: 700; margin-top: 28px; }
.base { font-size: 56px; line-height: 1.2; font-weight: 400; margin-top: 30px; }
.bar { height: 12px; border-radius: 6px; margin-top: 56px; position: relative; }
</style></head><body><script src="common.js"></script><script src="../../../v5/shots/numbers_b.js"></script><script src="charts_b.js"></script><script>
// Results finale: the headline numbers, one at a time, full screen. Near-black, one huge number in the audioforge colour,
// a plain line in white, the baselines in grey beneath, one short fine-print line (source names only). Numbers come
// from numbers_b.js (export_b.py <- runs/e2e_final.json for the live calls, runs/hybrid_asr.json + final_asr.json for
// the transcript); full provenance is in numbers_b.json. Cards: cut-ins, first words, unanswered turns (each (dur - 2)/3 s),
// then the optional transcript card (2 s, params.wer, default on). A thin line under each card fills over its time and
// the number slowly grows by 5 %.
const n = B.n, s = B.s, C = B.C;
const CALLS = "Real phone calls (otoSpeech), played live through Pipecat and LiveKit with out-of-the-box settings";
function cards(wer) {
  const c = [
    { pre: NB["live/cutins_less"].word, num: `${s("live/cutins_less")} %`, fin: s("live/cutins_less"), words: "fewer cut-ins than Pipecat's default",
      base: `audioforge ${s("live/oto/ours/cutins")} · Pipecat default ${s("live/oto/pipecat/cutins")} a minute`, fine: CALLS },
    { num: `${s("live/oto/ours/first")} s`, fin: s("live/oto/ours/first"), words: "to your first words on screen",
      base: `Pipecat default ${s("live/oto/pipecat/first")} s · LiveKit default ${s("live/oto/livekit/first")} s`, fine: CALLS },
    { num: `${s("live/oto/ours/unanswered")} %`, fin: s("live/oto/ours/unanswered"), words: "of turns left unanswered",
      base: `LiveKit default ${s("live/oto/livekit/unanswered")} % · Pipecat default ${s("live/oto/pipecat/unanswered")} %`, fine: CALLS },
  ];
  if (wer) c.push({ num: `${s("wer/ours")} %`, fin: s("wer/ours"), words: "word errors in the final transcript",
      base: `Whisper small ${s("wer/whisper_small")} %`, fine: "Meeting recordings (AMI); final transcript by NVIDIA Parakeet in the audioforge stack" });
  return c;
}
let K = [], fineEl;
function init(data, params, W, H) {
  const sq = H / W > 0.9, p = Object.assign({}, params.params || {}, params);
  const wer = p.wer !== false;
  const list = cards(wer);
  const longest = list.map(c => c.fine).sort((a, b) => b.length - a.length)[0];
  const ct = B.setup(W, H, longest, 1.02);
  fineEl = document.getElementById("fine");
  const bx = B.box, dur = p.dur || (wer ? 17 : 15);
  const T = wer ? (dur - 2) / 3 : dur / 3;
  const prim = B.abs(U.el("div", null, ct), { left: bx.x0, top: bx.y0, width: bx.w, height: bx.h, pointerEvents: "none" }); prim.setAttribute("data-primary", "");
  const bw = sq ? 720 : 1100;
  list.forEach((c, i) => {
    const t0 = i * T, t1 = i < 3 ? (i + 1) * T : dur;
    const e = B.abs(U.el("div", "card", ct), { left: bx.x0, top: bx.y0, width: bx.w, height: bx.h });
    const big = U.el("div", "big h1", e); U.css(big, { fontSize: (sq ? 190 : 250) + "px", color: C.ink });
    if (c.pre) U.el("span", "pre", big, c.pre);
    const num = U.el("span", null, big, B.nb(c.num)); num.style.color = C.ours;
    num.setAttribute("data-final", c.fin); num.setAttribute("data-done", t0);
    const w = U.el("div", "words", e, B.nb(c.words)); U.css(w, { color: C.ink, fontSize: (sq ? 60 : 72) + "px", maxWidth: bx.w + "px" });
    const b = U.el("div", "base", e, B.nb(c.base)); U.css(b, { color: C.muted, fontSize: (sq ? 48 : 56) + "px", maxWidth: bx.w + "px" });
    const bar = U.el("div", "bar", e); U.css(bar, { width: bw + "px", background: C.livekit });
    const f = U.el("div", null, bar); U.css(f, { position: "absolute", left: 0, top: 0, height: "12px", borderRadius: "6px", background: C.ours, width: "0px" });
    K.push({ e, f, big, t0, t1, fine: c.fine });
  });
  K.bw = bw;
}
function render(t, ctx) {
  B.frame(t, ctx);
  let cur = K[0];
  K.forEach((k, i) => {
    const a = i === 0 ? 1 : U.ease(U.seg(t, k.t0, 0.3));
    const b = i === K.length - 1 ? 1 : 1 - U.ease(U.seg(t, k.t1 - 0.3, 0.3));
    k.e.style.opacity = (a * b).toFixed(3);
    const q = U.clamp((t - k.t0) / (k.t1 - k.t0));
    k.f.style.width = (K.bw * q).toFixed(1) + "px";
    k.big.style.transform = `scale(${(1 + 0.05 * q).toFixed(4)})`;   // the number slowly grows over its card (never static)
    if (t >= k.t0) cur = k;
  });
  if (!(window.PARAMS && window.PARAMS.fine)) fineEl.textContent = B.nb(cur.fine);   // one short line per card (a shot-level PARAMS.fine overrides)
}
window.init = init; window.render = render;
</script></body></html>
