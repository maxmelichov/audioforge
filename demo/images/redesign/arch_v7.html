// heads around it). Exactly one encoder is drawn; the second pass is only the orange (2) loop that carries your voice

// exit to the turn head. Layer 17 -> RNNT -> streaming words leaves the right edge at the top; all 17 layers -> VAD

// one lane of the frozen model: 17 slabs; returns slab centres

  return { mx, tip }; }

// the reuse marker: a dashed grey bracket on the far left spanning both lanes, a vertical "↻ one model, used twice";

function circ(n, x, y, col) { const e = el("circ", String(n), 0, 0); e.style.border = `3px solid ${col}`; return place(e, x, y, 0.5, 0.5); }
