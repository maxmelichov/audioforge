</style></head><body><div id="stage"></div><script>
// architecture_v5 (demo/images/EXPLAINER.md is the source of truth). PASS 1 (tinted region): audio -> the frozen
// FastConformer, the only dark shape -> RNNT decoder -> streaming words; the all-17-layers bracket -> VAD head -> Speech?;
// layer 4 -> TS-VAD "Is it you?" <- voice print <- speaker head (reads layer 4) <- 5 s voice sample; -> your voice track.

// one lane of the frozen model: 17 slabs; returns slab centres
function lane(x, y, w, h, o, title, sub) {

// the reuse marker: a dashed grey bracket on the far left spanning both lanes, a vertical "↻ one model, used twice";

  wires.push(`<line x1="${gx}" y1="${gyy + gh}" x2="${gx + gw}" y2="${gyy + gh}" stroke="#C8CDD4" stroke-width="1.5"/>`);

                   sm: [712, 160], sk: [920, 170], gh: [695, 700, 540, 86, 16], turn: [1300, 160], sp: [1500, 200, 54], rnnt: [1335, 170], words: 1545, ly: 40,
