<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
:root { --page: #F7F8FA; --cardline: #E2E5E9; --grid: #ECEEF1; --axis: #9AA3AE; --good: #0A5C2B; --bad: #9B1C1C; --ink3: #3F4753; }

.fn { position: absolute; font-size: 22px; color: var(--ink2); line-height: 1.25; }

.pu { position: absolute; font-size: 22px; color: var(--ink2); line-height: 1.15; text-align: center; }

.val.us { color: var(--ink); font-weight: 800; }

.dl.tie { color: var(--ink2); }

.lg b { color: var(--ink); }

.xl.us { color: var(--ink); font-weight: 700; }

</style></head><body><div id="stage"></div><script>
// 0.6B core vs the 115M default, same harnesses, same audio per row. Numbers: research/CORE_0P6B.md §results
// (runs/core_0p6b.json, runs/hybrid_asr.json). Orange = 0.6B core, grey = 115M. Green = 0.6B better, red = 0.6B worse.

  Object.assign(e.style, { left: x + "px", top: y + "px" }); parent.appendChild(e); return e; }

const GREY = "#C8CDD4", OURS2 = "#F4A66B", STACK = 64;
function axis(spec, vals, A) {

  if (spec.domain) { const [lo, hi, step] = spec.domain; return [lo, hi, step, Math.min(A - 8, ph / ((mx - lo) / (hi - lo)))]; }

  throw new Error("no axis for " + spec.name);
}
const fmt = (t, step) => step < 1 ? t.toFixed(1) : String(Math.round(t));
const show = (v, d) => d === undefined ? String(v) : v.toFixed(d);
function chart(c, x, y, w, h, spec, o) {

  const vals = [spec.big, spec.small, spec.base];

  const px0 = x + tw, px1 = x + w - 4, pw = px1 - px0;
  tl.forEach((e, i) => { const yy = pb - ph * (ticks[i] - lo) / (hi - lo); place(e, px0 - 12, yy, 1, 0.5); if (i) line(px0, yy, px1, yy, css("--grid"), 1.5); });

  const bw = Math.min(o.bw, pw * 0.22), cx = [px0 + pw * 0.2, px0 + pw * 0.5, px0 + pw * 0.8];
  const cols = [css("--ours"), OURS2, GREY], labs = ["", "", spec.baseLabel];
  vals.forEach((v, i) => {
    const bh = ph * (v - lo) / (hi - lo);

    const vl = el("val" + (i < 2 ? " us" : ""), show(v, spec.dec), 0, 0, c); place(vl, cx[i], pb - bh - 4, 0.5, 1);
    if (labs[i]) { const xl = wrap(el("xl", labs[i], 0, 0, c), pw * 0.4); xl.style.textAlign = "center"; place(xl, cx[i], pb + 6, 0.5, 0); }
    if (i < 2) { const rel = spec.lower ? 100 * (1 - v / spec.base) : 100 * (v / spec.base - 1), better = rel > 0.5, tie = Math.abs(rel) <= 0.5;
      const txt = tie ? "same" : `${better ? (spec.lower ? "−" : "+") : (spec.lower ? "+" : "−")}${Math.abs(rel) < 10 ? Math.abs(rel).toFixed(1) : Math.round(Math.abs(rel))}%`;
      const d = el("dl" + (tie ? " tie" : better ? "" : " bad"), txt, 0, 0, c); d.style.fontSize = "22px"; place(d, cx[i], pb - bh - 4 - vl.offsetHeight - 4, 0.5, 1); }
  });

}
const CARDS = {
  asst: { title: "Turn-taking: speech to an agent", plain: "Both cores pick the right moment far more often (0.6B: before the fix).", fn: "Pipecat smart‑turn v3.2 + Silero · its 399 public test clips",
    charts: [{ name: "Accuracy", unit: "% of clips right", lower: false, big: 91.2, small: 92.2, base: 69.7, baseLabel: "smart‑turn", dec: 1, domain: [0, 100, 50] },
             { name: "Cut-offs mid-sentence", unit: "% of unfinished sentences", lower: true, big: 7.1, small: 5.4, base: 40.2, baseLabel: "smart‑turn", dec: 1 }] },
  calls: { title: "Turn-taking on calls", plain: "Fast preset: as quick as LiveKit, far fewer missed turn ends (0.6B: before the fix).", fn: "LiveKit Agents 1.8 turn detector + Silero · 109 turn ends, 32 two‑party calls, user’s channel",
    charts: [{ name: "End-of-turn latency", unit: "median, ms", lower: true, big: 530, small: 547, base: 567, baseLabel: "LiveKit" },
             { name: "False interruptions", unit: "% of your turns", lower: true, big: 33.9, small: 24.8, base: 26.6, baseLabel: "LiveKit", dec: 1 },
             { name: "Missed turn ends", unit: "% of turn ends", lower: true, big: 11.9, small: 5.5, base: 22.9, baseLabel: "LiveKit", dec: 1 }] },
  wer: { title: "Words", plain: "Nemotron 0.6B hears best. The 115M trails Whisper small on calls but wins once only your words count.", fn: "Whisper small = LiveKit’s default STT, 32 live calls · Nemotron‑3 diarization + print, ICSI meetings",
    charts: [{ name: "Live calls", unit: "WER %", lower: true, big: 13.7, small: 23.2, base: 19.3, baseLabel: "Whisper small", dec: 1 },
             { name: "Meetings, your words only", unit: "target-speaker WER %", lower: true, big: 31.7, small: 37.1, base: 65, baseLabel: "Nemotron‑3", dec: 1 }] },
  vad: { title: "Voice activity detection", plain: "Both cores tie each other and beat MarbleNet.", fn: "NVIDIA MarbleNet v2 · AMI meetings · F1 at threshold 0.5",
    charts: [{ name: "F1 score", unit: "higher is better", lower: false, big: 0.951, small: 0.951, base: 0.937, baseLabel: "MarbleNet", dec: 3, domain: [0.8, 1.0, 0.1] }] },
};
function card(k, x, y, w, h) {
  const C = CARDS[k], c = el("card", "", x, y); Object.assign(c.style, { width: w + "px", height: h + "px" });
  const P = 30, iw = w - 2 * P, T = 18;
  const t = el("ct", C.title, P, T, c);
  const p = wrap(el("plain", C.plain, P, T + t.offsetHeight + 4, c), iw);
  const f = wrap(el("fn", C.fn, P, 0, c), iw); f.style.top = (h - 14 - f.offsetHeight) + "px";
  let top = p.offsetTop + p.offsetHeight + 10;
  const lower = C.charts.every(sp => sp.lower), higher = C.charts.every(sp => !sp.lower);
  if (lower || higher) place(el("lg", lower ? "lower is better" : "higher is better", 0, 0, c), P + iw, t.offsetTop + t.offsetHeight - 3, 1, 1);
  const bot = f.offsetTop - 10, n = C.charts.length, gap = 40, cw = (iw - gap * (n - 1)) / n;
  let hdr = 0; C.charts.forEach(sp => { const a = wrap(el("ph", sp.name, 0, 0, c), cw), b = wrap(el("pu", sp.unit, 0, 0, c), cw); hdr = Math.max(hdr, a.offsetHeight + b.offsetHeight); a.remove(); b.remove(); });
  const O = { hdr, bw: 84 }, probe = document.createElement("div"); c.appendChild(probe);
  O.ph = Math.min(...C.charts.map((sp, i) => chart(probe, P + i * (cw + gap), top, cw, bot - top, sp, { ...O, probe: true }))); probe.remove();
  C.charts.forEach((sp, i) => chart(c, P + i * (cw + gap), top, cw, bot - top, sp, O));
  const sv = document.createElementNS("http://www.w3.org/2000/svg", "svg"); sv.setAttribute("width", w - 4); sv.setAttribute("height", h - 4);
  Object.assign(sv.style, { position: "absolute", left: 0, top: 0, overflow: "visible" }); sv.innerHTML = svg.join(""); svg = []; c.prepend(sv);
}
function build(W, H) {
  Object.assign(st.style, { width: W + "px", height: H + "px" }); st.innerHTML = ""; svg = [];
  const M = 64;
  const h1 = el("h9", "One set of heads, two cores (draft)", M, M); h1.style.fontSize = "48px";
  const sub = wrap(el("s9", "Same six heads on either core, same tests, same audio for all three bars. Green: better than the model in use today. Red: worse.", M, 0), W - 2 * M);
  place(sub, M, h1.offsetTop + h1.offsetHeight + 6);
  const lg = el("lg", `<span class="sw" style="background:${css("--ours")}"></span><b>Nemotron 0.6B</b>&nbsp;&nbsp;&nbsp;<span class="sw" style="background:${OURS2}"></span><b>FastConformer 115M</b>&nbsp;&nbsp;&nbsp;<span class="sw" style="background:${GREY}"></span>model in use today`, 0, 0);
  lg.style.fontSize = "24px"; place(lg, W - M, h1.offsetTop + h1.offsetHeight - 2, 1, 1);
  const f = wrap(el("f9", "Draft layout only. Final version after the 0.6B turn fix, with every row re-measured in one run (both cores and the baselines on the same audio).", M, 0), W - 2 * M);
  f.style.top = (H - M - f.offsetHeight) + "px";
  const top = sub.offsetTop + sub.offsetHeight + 18, bot = f.offsetTop - 14, gx = 30, gy = 14, cw = (W - 2 * M - gx) / 2, ch = (bot - top - gy) / 2;
  const wa = (W - 2 * M - gx) * 0.42, wc = W - 2 * M - gx - wa;

window.build = build;
const q = new URLSearchParams(location.search); if (q.get("w")) build(+q.get("w"), +q.get("h"));
</script></body></html>
