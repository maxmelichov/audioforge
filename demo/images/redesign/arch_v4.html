<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.l1 { position: absolute; font-weight: 700; color: var(--ink); line-height: 1.1; white-space: nowrap; }
.l2 { position: absolute; font-size: 22px; color: var(--ink2); line-height: 1.2; white-space: nowrap; }
.blk { position: absolute; background: var(--slate); border-radius: 16px; }
.blk .bt { position: absolute; color: #FFFFFF; font-weight: 700; white-space: nowrap; line-height: 1.1; }
.blk .bs { position: absolute; color: var(--onslate); font-size: 22px; white-space: nowrap; line-height: 1.1; }
.slab { position: absolute; background: var(--slab); border-radius: 4px; }
.slab.tap { background: var(--ours); }
.box { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; line-height: 1.15; text-align: center; }
.box.ours { background: #FFFFFF; border: 2.5px solid var(--ours); }
.box.nv { background: var(--slate); color: #FFFFFF; }
.box.grey { background: var(--panel); border: 1.5px solid #C3C9D1; }
.box.grey .a { color: #3F4753; }
.box .m { font-weight: 700; color: var(--ink); }
.box.nv .m { color: #FFFFFF; }
.box .a { font-size: 22px; color: var(--ink2); margin-top: 2px; }
.box.nv .a { color: var(--onslate); }
.zone { position: absolute; border: 2px dashed #AEB6C0; border-radius: 18px; background: #FAFBFC; }
.circ { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; font-size: 22px; font-weight: 700;
  color: var(--ink); display: flex; align-items: center; justify-content: center; line-height: 1; }
.badge { position: absolute; font-size: 22px; font-weight: 700; color: var(--ink); background: #FFFFFF; border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
.blk, .slab, .box, .circ, .badge, .l1, .l2, .wave { z-index: 2; } svg.wires { z-index: 1; } .zone { z-index: 0; }
.wave i { position: absolute; background: #6B7280; border-radius: 3px; }
</style></head><body><div id="stage"></div><script>
// architecture_v4 (demo/images/EXPLAINER.md is the source of truth). The frozen NVIDIA FastConformer is drawn ONCE
// ("runs twice per chunk"); the two passes are two numbered routes through it: (1) slate: audio -> block -> RNNT
// decoder -> streaming words; all-layers brace -> Speech?; layer 4 -> TS-VAD "Is it you?" (voice sample -> same
// model, layer 4, once -> speaker head) -> your voice track. (2) orange: audio + your voice track (loops back into
// the block's left side; speaker kernels at blocks 1 and 3, runs/stage1_served.afm) -> block -> turn head (GRU) ->
// end-of-turn probability over a threshold -> turn end -> optional Parakeet (dashed zone). ?notext=1 hides the
// annotations.
const st = document.getElementById("stage"); const wires = [];
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function el(cls, html, x, y, w, h) { const e = document.createElement("div"); e.className = cls; if (html != null) e.innerHTML = html;
  Object.assign(e.style, { left: x + "px", top: y + "px" }); if (w) e.style.width = w + "px"; if (h) e.style.height = h + "px"; st.appendChild(e); return e; }
function R(e) { const r = e.getBoundingClientRect(); return { l: r.left, t: r.top, r: r.right, b: r.bottom, cx: (r.left + r.right) / 2, cy: (r.top + r.bottom) / 2 }; }
function wire(pts, { col = "#8A939E", w = 2.2, head = true, dash = false } = {}) {
  wires.push(`<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ")}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${dash ? ' stroke-dasharray="6 6"' : ""}/>`);
  if (head) { const [x2, y2] = pts[pts.length - 1], [x1, y1] = pts[pts.length - 2], a = Math.atan2(y2 - y1, x2 - x1), s = 11;
    wires.push(`<path d="M${x2 - s * Math.cos(a - 0.55)} ${y2 - s * Math.sin(a - 0.55)} L${x2} ${y2} L${x2 - s * Math.cos(a + 0.55)} ${y2 - s * Math.sin(a + 0.55)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`); } }
const OR = () => ({ col: css("--ours"), w: 2.6 });
function l1(t, x, y, z) { const e = el("l1", t, x, y); e.style.fontSize = z + "px"; return e; }
function l2(t, x, y) { return el("l2", t, x, y); }
function box(cls, main, ann, x, y, w, h, z) { const e = el("box " + cls, `<div class="m" style="font-size:${z}px">${main}</div>` + (ann ? `<div class="a">${ann}</div>` : ""), x, y, w, h); return e; }
function wave(x, y, w, h) { const v = [0.3, 0.55, 0.85, 0.5, 1, 0.7, 0.4, 0.8, 0.55, 0.35, 0.6, 0.25]; const b = el("wave", "", x, y, w, h); b.style.position = "absolute";
  v.forEach((k, i) => { const s = document.createElement("i"); Object.assign(s.style, { left: (i * w / v.length + w / v.length * 0.2) + "px", width: (w / v.length * 0.55) + "px", top: (h * (1 - k) / 2) + "px", height: (h * k) + "px" }); b.appendChild(s); }); return b; }
// one lane of the frozen model: 17 slabs; returns slab centres
function lane(x, y, w, h, o, title, sub) {
  const b = el("blk", "", x, y, w, h);
  const t = document.createElement("div"); t.className = "bt"; t.innerHTML = title; Object.assign(t.style, { left: o.pad + "px", top: "12px", fontSize: o.tz + "px" }); b.appendChild(t);
  if (sub) { const s = document.createElement("div"); s.className = "bs"; s.innerHTML = sub; Object.assign(s.style, { right: o.pad + "px", top: "14px" }); b.appendChild(s); }
  const gap = (w - 2 * o.pad - 17 * o.sw) / 16, cx = [];
  for (let k = 1; k <= 17; k++) { const sx = x + o.pad + (k - 1) * (o.sw + gap); el("slab" + (o.tap === k ? " tap" : ""), "", sx, y + o.top, o.sw, h - o.top - o.bot); cx.push(sx + o.sw / 2); }
  return { b, cx, R: R(b), sy0: y + o.top, sy1: y + h - o.bot }; }
function brace(x1, x2, y, up, col) {   // curly brace over [x1, x2]; tip away from the lane
  const d = up ? -1 : 1, y1 = y + 14 * d, tip = y + 28 * d, mx = (x1 + x2) / 2, r = 14;
  wires.push(`<path d="M${x1} ${y} Q${x1} ${y1} ${x1 + r} ${y1} L${mx - r} ${y1} Q${mx} ${y1} ${mx} ${tip} Q${mx} ${y1} ${mx + r} ${y1} L${x2 - r} ${y1} Q${x2} ${y1} ${x2} ${y}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round"/>`);
  return { mx, tip }; }

// the reuse marker: a dashed grey bracket on the far left spanning both lanes, a vertical "↻ one model, used twice";
// it touches neither lane's output side, so nothing can read as pass-1 output flowing into pass 2
function place(e, x, y, ax = 0, ay = 0) { e.style.left = (x - ax * e.offsetWidth) + "px"; e.style.top = (y - ay * e.offsetHeight) + "px"; return e; }
function circ(n, x, y, col) { const e = el("circ", String(n), 0, 0); e.style.border = `3px solid ${col}`; return place(e, x, y, 0.5, 0.5); }
function spark(gx, gyy, gw, gh, O) {
  const ps = [0.05, 0.08, 0.06, 0.1, 0.07, 0.12, 0.09, 0.2, 0.35, 0.55, 0.8], thr = gyy + gh * 0.28;
  const pts = ps.map((p, i) => [gx + i * gw / (ps.length - 1), gyy + gh * (1 - p)]);
  wires.push(`<line x1="${gx}" y1="${thr}" x2="${gx + gw}" y2="${thr}" stroke="#8A939E" stroke-width="1.5"/>`);
  wires.push(`<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${O}" stroke-width="2.6"/>`);
  wires.push(`<line x1="${gx}" y1="${gyy + gh}" x2="${gx + gw}" y2="${gyy + gh}" stroke="#C8CDD4" stroke-width="1.5"/>`);
  const c = pts[pts.length - 1]; wires.push(`<circle cx="${c[0]}" cy="${c[1]}" r="6" fill="${O}"/>`); return c; }
function build(W, H) {
  Object.assign(st.style, { width: W + "px", height: H + "px" }); st.innerHTML = ""; wires.length = 0;
  const M = 64, sq = H / W > 0.9, O = css("--ours"), S1 = css("--slate");
  const R1 = { col: S1, w: 2.6 }, R2 = { col: O, w: 2.8 };
  const P = sq ? { tz: 30, z1: 24, zb: 22, bx: 232, bw: 480, bt: 286, bh: 250, pad: 18, sw: 13, wx: 64, ww: 84, brx: 178, lx: 212, ox: 780, gy: 648,
                   dec: [758, 100], turn: [758, 150], row: 764, legY: 124, badge: 1 }
               : { tz: 40, z1: 30, zb: 24, bx: 500, bw: 660, bt: 318, bh: 250, pad: 26, sw: 24, wx: 118, ww: 120, brx: 300, lx: 470, ox: 1480, gy: 672,
                   dec: [1216, 180], turn: [1216, 170], row: 790, legY: 128 };
  const t1 = l1("One frozen NVIDIA model, small audioforge heads", M, M + 2, P.tz);
  // legend
  const lgy = R(t1).b + 24; circ(1, M + 16, lgy, S1); const lg1 = l2("first pass", M + 40, 0); place(lg1, M + 40, lgy, 0, 0.5);
  const x2 = R(lg1).r + 40; circ(2, x2 + 16, lgy, O); place(l2("second pass, same model", 0, 0), x2 + 40, lgy, 0, 0.5);
  // the one block
  const A = lane(P.bx, P.bt, P.bw, P.bh, { pad: P.pad, sw: P.sw, top: 58, bot: 44, tz: P.zb, tap: 4 }, "Frozen FastConformer", "");
  const bd = el("badge", "runs twice per chunk", 0, 0); bd.style.border = `2px solid ${S1}`; place(bd, A.R.r - 16, A.R.t, 1, 0.5); if (sq) { bd.style.padding = "2px 10px"; place(bd, A.R.r - 12, A.R.t, 1, 0.5); A.b.querySelector(".bt").style.top = "24px"; }
  [[1, "1"], [4, "4"], [17, "17"]].forEach(([k, t]) => { const e = el("l2", t, 0, 0); e.style.background = css("--slate"); e.style.color = k === 4 ? "#FFFFFF" : "var(--onslate)"; if (k === 4) e.style.fontWeight = 700; place(e, A.cx[k - 1], A.R.b - 10, 0.5, 1); });
  const y1 = A.R.t + 76, y2 = A.R.b - 66, y3 = A.R.b - 30;
  // audio: route 1 (slate) and route 2 (orange) into the left side
  const au = l1("Audio", P.wx, 0, P.z1); place(au, P.wx, y1 - 40, 0, 1); wave(P.wx, y1 - 34, P.ww, 68);
  wire([[P.wx + P.ww + 10, y1], [A.R.l - 8, y1]], R1);
  wire([[P.brx, y1 + 2], [P.brx, y2], [A.R.l - 8, y2]], R2);
  circ(1, P.lx - 4, y1, S1); circ(2, P.lx - 4, y2, O);
  // route 1: all layers -> Speech?
  const br = brace(A.cx[0], A.cx[16], A.R.t - 22, true, S1), sy = sq ? 206 : 214;
  wire([[br.mx, br.tip], [br.mx, sy], [P.ox - 14, sy]], R1);
  place(l2(sq ? "all layers · 80 ms · 33K" : "all layers · every 80 ms · 33K", 0, 0), br.mx + 14, sy - 6, 0, 1);
  place(l1("Speech?", 0, 0, P.z1), P.ox, sy, 0, 0.5);
  // right end: route 1 -> decoder -> words; route 2 -> turn head (separate, parallel)
  const ex = A.R.r + (sq ? 22 : 30);
  const d = box("grey", sq ? "RNNT<br>decoder" : "RNNT decoder", null, P.dec[0], y1 - (sq ? 32 : 28), P.dec[1], sq ? 64 : 56, 22); d.querySelector(".m").style.whiteSpace = "nowrap";
  wire([[A.R.r + 6, y1], [P.dec[0] - 8, y1]], R1); circ(1, ex, y1, S1);
  const th = box("ours", "Turn head", "GRU · 0.32M", P.turn[0], y2 - 36, P.turn[1], 72, 22);
  wire([[A.R.r + 6, y2], [P.turn[0] - 8, y2]], R2); circ(2, ex, y2, O);
  const dr = R(d), hr = R(th);
  let tl, gx, gyy;
  if (!sq) { wire([[dr.r + 8, y1], [P.ox - 14, y1]], R1);
    const wl = l1("Streaming words", P.ox, 0, P.z1); place(wl, P.ox, y1 - 6, 0, 0.5); place(l2("every 160 ms", 0, 0), P.ox, R(wl).b + 2);
    wire([[hr.r + 8, y2], [P.ox - 14, y2]], R2);
    tl = l1("Turn over?", P.ox, y2 - 36, P.z1); gx = P.ox; gyy = R(tl).b + 6; }
  else { wire([[dr.r + 6, y1], [dr.r + 20, y1]], R1);
    const wl = l1("Streaming<br>words", 0, 0, 22); wl.style.whiteSpace = "normal"; place(wl, dr.r + 26, y1, 0, 0.5); place(l2("every 160 ms", 0, 0), dr.r + 26, R(wl).b + 2);
    tl = l1("Turn over?", hr.l, hr.b + 16, 22); gx = hr.l; gyy = R(tl).b + 8; }
  const gw = sq ? 130 : 210, gh = sq ? 46 : 54, cr = spark(gx, gyy, gw, gh, O);
  place(l2("every 80 ms", 0, 0), sq ? gx - 14 : gx, sq ? gyy + gh / 2 : gyy + gh + 6, sq ? 1 : 0, sq ? 0.5 : 0);
  const te = l1(sq ? "Turn<br>end" : "Turn end", 0, 0, sq ? 22 : P.zb + 2); te.style.whiteSpace = "normal"; place(te, gx + gw + 38, cr[1], 0, 0.5);
  wire([[cr[0] + 9, cr[1]], [gx + gw + 30, cr[1]]], R2);
  // route 1: layer 4 -> Is it you? (TS-VAD); voice sample -> same model, layer 4, once -> speaker head -> Is it you?
  const s4 = A.cx[3], gy = P.gy, tw = sq ? 176 : 200;
  const ts = box("ours", "Is it you?", "TS-VAD · 0.26M", s4 - tw / 2, gy - 38, tw, 76, 22), t = R(ts);
  wire([[s4, A.R.b + 4], [s4, t.t - 6]], R1); place(l2("layer 4", 0, 0), s4 + 12, (A.R.b + t.t) / 2, 0, 0.5);
  const kw = sq ? 170 : 190, sk = box("ours", "Speaker head", "reads layer 4", s4 - kw / 2, P.row - 6, kw, 64, 22), k = R(sk);
  wire([[s4, k.t - 4], [s4, t.b + 6]], R1);
  const smw = sq ? 150 : 170, sm = box("grey", "Voice sample", "5 s", k.l - 34 - smw, k.cy - 32, smw, 64, 22);
  wire([[R(sm).r + 4, k.cy], [k.l - 6, k.cy]], R1);
  // route 2: your voice track loops back from Is it you? into the block's left side (blocks 1 and 3)
  wire([[t.l - 6, gy], [P.lx, gy], [P.lx, y3], [A.R.l - 8, y3]], R2);
  const la = P.lx - 16;
  place(l2(sq ? "blocks 1, 3" : "into blocks 1 and 3", 0, 0), la, y3, 1, 0.5);
  const vt = l1(sq ? "Your voice<br>track" : "Your voice track", 0, 0, sq ? 22 : P.zb); vt.style.textAlign = "right"; place(vt, la, (y3 + gy) / 2 - (sq ? 8 : 14), 1, 1);
  const strip = [[0.20, O], [0.12, "#C8CDD4"], [0.18, "#FFFFFF"], [0.28, O], [0.10, "#C8CDD4"], [0.12, O]], swd = sq ? 150 : 200; let sx0 = la - swd, sy0 = R(vt).b + 6;
  strip.forEach(([f, col]) => { wires.push(`<rect x="${sx0}" y="${sy0}" width="${f * swd}" height="12" fill="${col}" stroke="#AEB6C0" stroke-width="1"/>`); sx0 += f * swd; });
  place(l2(sq ? "every 80 ms" : "you · other · no one, every 80 ms", 0, 0), la, sy0 + 20, 1, 0);
  // optional zone: turn end -> Parakeet on the finished turn -> final transcript
  const f = el("foot abs", sq ? "FastConformer 109 M, cache-aware · voice print made once by the speaker head (0.5 M) from layer-4 features · the second pass reuses the first pass’s front end; speaker kernels at blocks 1, 3 · no diarizer"
                              : "Encoder: NVIDIA FastConformer 109 M, cache-aware (70 frames), log-mel 80, ×8 subsampling, 80 ms frames, 160 ms chunks · voice print: 192-d, made once by the speaker head (0.5 M) from the sample’s layer-4 features · the second pass reuses the first pass’s front end; speaker kernels at blocks 1 and 3 · no diarizer (--turn-input tsvad --diar-off)", M, 0, W - 2 * M);
  f.style.top = (H - M - f.offsetHeight - 2) + "px";
  const zh = sq ? 76 : 112, zy = f.offsetTop - (sq ? 20 : 26) - zh, zx = sq ? M : P.turn[0], zw = sq ? W - 2 * M : W - M - P.turn[0];
  el("zone", "", zx, zy, zw, zh);
  const ol = l1("Optional", 0, 0, 22); ol.style.color = "var(--ink2)"; if (sq) place(ol, zx + 20, zy + zh / 2, 0, 0.5); else place(ol, zx + 18, zy + 10);
  const pk = box("grey", "Parakeet", "on the finished turn", sq ? 420 : zx + 24, sq ? zy + 8 : zy + 42, sq ? 240 : 260, sq ? 60 : 60, 22), pr = R(pk);
  wire([[pr.r + 8, pr.cy], [pr.r + 40, pr.cy]]); place(l1("Final transcript", 0, 0, sq ? 22 : P.zb + 2), pr.r + 48, pr.cy, 0, 0.5);
  const tr = R(te); wire([[tr.cx, tr.b + 6], [tr.cx, zy - 12], [pr.cx, zy - 12], [pr.cx, pr.t - 6]]);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "wires"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = wires.join(""); st.prepend(svg);
  if (new URLSearchParams(location.search).get("notext")) notext();
}
// removal test: hide every explanatory annotation (level 2) and the footer (level 3); level-1 labels stay
function notext() { const s = document.createElement("style"); s.textContent = "#stage .l2, #stage .foot, #stage .box .a { color: transparent !important; } /* transparent !important */"; document.head.appendChild(s); }
window.build = build; window.notext = notext;
const q = new URLSearchParams(location.search); if (q.get("w")) build(+q.get("w"), +q.get("h"));
</script></body></html>
