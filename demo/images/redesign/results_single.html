<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.pn { position: absolute; }
.pt { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; color: var(--ink); }
.ps { font-size: 22px; line-height: 1.3; color: var(--ink2); margin-top: 6px; }
.rows { position: relative; }
.rw { position: absolute; left: 0; right: 0; display: flex; align-items: center; }
.rl { flex: none; font-size: 24px; line-height: 1.1; color: var(--ink2); white-space: nowrap; }
.rl.us { color: var(--ink); font-weight: 700; }
.bar { flex: none; border-radius: 6px; background: var(--grey-bar); }
.bar.us { background: var(--ours); }
.rv { flex: none; font-size: 26px; font-weight: 700; color: var(--ink); margin-left: 12px; white-space: nowrap; line-height: 1; }
.rv.them { font-weight: 400; color: #2B3138; }
.base { position: absolute; width: 1.5px; background: #8A939E; }
.note { font-size: 22px; line-height: 1.3; color: var(--ink2); }
.note b { color: var(--ink); }
.legend { font-size: 24px; color: var(--ink2); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.sw { display: inline-block; width: 22px; height: 22px; border-radius: 5px; }
.sep { position: absolute; height: 1px; background: var(--rule); }
.psr { display: flex; align-items: flex-start; gap: 16px; }
.psr .ps { flex: 1; }
.dir { flex: none; font-size: 22px; line-height: 1.3; color: var(--ink2); white-space: nowrap; margin-top: 6px; }
</style></head><body><div id="stage"></div><script src="numbers_single.js"></script><script>
// Results panel for the post (DESIGN_NOTES.md). ?layout=grid (B1: 3x2 small multiples, Anthropic / DeepMind model-card
// bars turned horizontal) or ?layout=list (B2: one ranked list per metric stacked vertically, NVIDIA Nemotron-3
// diarization chart). Every number is a numbers_b "shown" string (demo/v5/shots/numbers_b.js <- export_b.py <-
// runs/*.json); each value element carries data-key so render.py checks it against numbers_b.json. Definitions and
// wording as in the reviewed v5 results image (demo/v5/shots/results_img.html).
const st = document.getElementById("stage");
const E = k => { const e = NS[k]; if (!e) throw new Error("numbers_single has no " + k); return e; };
const s = k => { const e = E(k); return e.shown != null ? e.shown : String(e.value); };
const v = k => E(k).value;
const N = k => `<span data-key="ns:${k}">${s(k)}</span>`;          // a number on the image, checked against the JSON
const row = (label, key, us) => ({ label, key, us });
// sort: best first (ours is best on every panel); lower = lower is better
const PANELS = {
  find: { title: "Finds your voice", lower: false, pairs: true,
    sub: "How well it tracks when you speak, given a 5-second sample of your voice (F1, 0 to 1); grey: NVIDIA Sortformer v2 bound to the same sample",
    subSq: "Tracking your speech (F1, 0 to 1); grey: NVIDIA Sortformer v2 given the same sample",
    rows: [row("ICSI, Sortformer", "find/icsi/sortformer"), row("ICSI, audioforge", "find/icsi/ours", 1), row("AMI, Sortformer", "find/ami/sortformer"), row("AMI, audioforge", "find/ami/ours", 1)] },
  done: { title: "Knows when you’re done", titleSq: "Knows you’re done", lower: true, pairs: true,
    sub: "Missed turn ends in meetings (%): one model with your voice sample vs our two-model stack without it",
    subSq: "Missed turn ends (%): one model with your sample vs two models without",
    rows: [row("ICSI, two models", "ts/icsi/before"), row("ICSI, one model", "ts/icsi/after", 1), row("AMI, two models", "ts/ami/before"), row("AMI, one model", "ts/ami/after", 1)] },
  vad: { title: "Hears speech better", lower: false,
    sub: "Speech-detection score out of 100 (the same head in single-model mode): edges NVIDIA’s MarbleNet, clearly ahead of Silero",
    subSq: "Speech-detection score out of 100: edges NVIDIA’s MarbleNet, clearly ahead of Silero",
    rows: [row("audioforge", "vad/ours", 1), row("NVIDIA MarbleNet", "vad/marblenet"), row("Silero", "vad/silero")] },
  cut: { title: "Talks over you less", lower: true,
    sub: () => `Times per call the agent talks over you, on the same ${s("live/sessions")} Pipecat calls`,
    rows: [row("audioforge, one model", "live/T/cutins", 1), row("audioforge, two models", "live/C/cutins"), row("Pipecat default", "live/A/cutins")] },
  rtf: { title: "Half the compute", lower: true,
    sub: "Fraction of real time the server uses on 2 CPU threads; lower is faster",
    rows: [row("audioforge, one model", "rtf/T", 1), row("audioforge, two models", "rtf/C")] },
  wer: { title: "Better final transcript (optional)", titleSq: "Final transcript (optional)", lower: true,
    sub: "Word errors in meetings (%) with the optional Parakeet pass on each finished turn; grey: Whisper small",
    subSq: "Word errors in meetings (%), optional Parakeet pass; grey: Whisper small",
    rows: [row("audioforge + Parakeet", "wer/ours", 1), row("Whisper small", "wer/whisper_small")] },
};
const ORDER = ["find", "done", "vad", "cut", "rtf", "wer"];
const TITLE = "audioforge in single-model mode, measured";
const FOOTER_SQ = () => `Meetings (AMI, ICSI), offline, 5-second voice sample; false cut-offs stay about the same (AMI ${N("ts/ami/before_fc")} → ${N("ts/ami/after_fc")} %, ICSI ${N("ts/icsi/before_fc")} → ${N("ts/icsi/after_fc")} %) · ${N("live/sessions")} live Pipecat ${N("version/pipecat")} sessions over ${N("live/clips")} clips (single-model runs new, the others stored) · compute: median server real-time factor`;
const FOOTER = () => `Voice tracking and turn ends: AMI and ICSI meetings, offline, a 5-second voice sample from elsewhere in the meeting; with the sample, false cut-offs stay about the same (AMI ${N("ts/ami/before_fc")} → ${N("ts/ami/after_fc")} %, ICSI ${N("ts/icsi/before_fc")} → ${N("ts/icsi/after_fc")} %) · calls: ${N("live/sessions")} live sessions over ${N("live/clips")} recorded calls and meeting clips through Pipecat ${N("version/pipecat")}; the single-model runs are new, the others are the stored runs on the same clips · compute: median server real-time factor · speech detection: AMI meetings · transcript: AMI meetings`;
function el(cls, html, x, y, w, parent = st) { const e = document.createElement("div"); e.className = cls; if (html != null) e.innerHTML = html;
  if (x != null) Object.assign(e.style, { left: x + "px", top: y + "px" }); if (w) e.style.width = w + "px"; parent.appendChild(e); return e; }
function tw(str, size, weight) { const c = tw.c || (tw.c = document.createElement("canvas").getContext("2d")); c.font = `${weight} ${size}px ${getComputedStyle(document.body).fontFamily}`; return c.measureText(str).width; }
const txt = x => typeof x === "function" ? x() : x;
// paired panel (before -> voice print): pairs stay adjacent, pairs ordered by the voice-print value, best first
function sorted(P) { if (P.pairs) { const pr = []; for (let i = 0; i < P.rows.length; i += 2) pr.push([P.rows[i], P.rows[i + 1]]);
    return pr.sort((a, b) => P.lower ? v(a[1].key) - v(b[1].key) : v(b[1].key) - v(a[1].key)).flat(); }
  if (P.keep) return P.rows; return [...P.rows].sort((a, b) => P.lower ? v(a.key) - v(b.key) : v(b.key) - v(a.key)); }
// bars of one metric into box (x, y, w); z: bar height, row pitch, label width. Returns the height used.
function bars(key, parent, x, y, w, z) {
  const P = PANELS[key], rows = sorted(P), max = Math.max(...rows.map(r => v(r.key)));
  const box = el("rows", "", x, y, w, parent); box.style.position = "absolute"; box.style.height = (rows.length * z.pitch) + "px";
  const valW = Math.max(...rows.map(r => tw(s(r.key), z.val, 700))) + 16, barMax = w - z.labW - valW;
  rows.forEach((r, i) => {
    const rw = el("rw", "", null, null, 0, box); rw.style.top = (i * z.pitch) + "px"; rw.style.height = z.pitch + "px";
    const l = el("rl" + (r.us ? " us" : ""), r.label, null, null, 0, rw); l.style.width = z.labW + "px"; l.style.fontSize = z.lab + "px";
    const b = el("bar" + (r.us ? " us" : ""), "", null, null, 0, rw); b.style.width = Math.max(6, barMax * v(r.key) / max) + "px"; b.style.height = z.bar + "px";
    const t = el("rv" + (r.us ? "" : " them"), N(r.key), null, null, 0, rw); t.style.fontSize = z.val + "px";
  });
  const base = el("base", "", null, null, 0, box); Object.assign(base.style, { left: (z.labW - 1) + "px", top: (z.pitch - z.bar) / 2 - 4 + "px", height: (rows.length * z.pitch - (z.pitch - z.bar) + 8) + "px" });
  return rows.length * z.pitch; }
function labW(keys, size) { return Math.max(...keys.flatMap(k => PANELS[k].rows.map(r => tw(r.label, size, r.us ? 700 : 400)))) + 18; }
function header(W, sq) {
  const M = 64;
  const h = el("h1 abs", TITLE, M, M + 4, W - 2 * M); if (sq) h.style.fontSize = "38px";
  const lg = el("legend abs", `<span class="sw" style="background:var(--ours)"></span>audioforge, single model&nbsp;&nbsp;&nbsp;<span class="sw" style="background:var(--grey-bar)"></span>the system it is compared with`, M, M + 8 + h.offsetHeight + 8, W - 2 * M);
  if (sq) lg.style.fontSize = "22px";
  return M + 8 + h.offsetHeight + 8 + lg.offsetHeight; }
function footer(W, H) { const f = el("foot abs", (H / W > 0.9 ? FOOTER_SQ : FOOTER)(), 64, 0, W - 128); f.style.top = (H - 64 - f.offsetHeight - 4) + "px"; return f.offsetTop; }

// subtitle line with the direction tag at its right end (Datawrapper: "↑ higher is better" / "↓ lower is better")
// wide: the tag closes the subtitle line; square (narrow panels): it closes the title line, same size and grey
const DIR = P => P.lower ? "↓ lower is better" : "↑ higher is better";
function subline(P, sq, pn) { if (sq) return el("ps", SUB(P, sq), null, null, 0, pn);
  const r = el("psr", "", null, null, 0, pn); el("ps", SUB(P, sq), null, null, 0, r); el("dir", DIR(P), null, null, 0, r); return r; }
function titleline(P, sq, pn, size) { let host = pn;
  if (sq) { host = el("psr", "", null, null, 0, pn); host.style.alignItems = "baseline"; }
  const t = el("pt", sq && P.titleSq ? P.titleSq : P.title, null, null, 0, host); if (size) t.style.fontSize = size + "px";
  if (sq) { t.style.flex = "1"; const d = el("dir", DIR(P), null, null, 0, host); d.style.marginTop = "0"; }
  return t; }
const SUB = (P, sq) => txt(sq && P.subSq ? P.subSq : P.sub), NOTE = (P, sq) => P.note ? (sq && P.noteSq ? P.noteSq() : P.note()) : null;
function grid(W, H) {
  const M = 64, sq = H / W > 0.9;
  const top = header(W, sq) + (sq ? 24 : 44), bot = footer(W, H) - (sq ? 22 : 36);
  const cols = sq ? 2 : 3, nr = sq ? 3 : 2, gx = sq ? 56 : 80;
  const pw = (W - 2 * M - gx * (cols - 1)) / cols;
  const z = sq ? { lab: 22, val: 24, bar: 20, pitch: 28 } : { lab: 24, val: 26, bar: 28, pitch: 46 };
  z.labW = labW(ORDER, z.lab);
  const P0 = ORDER.map((k, i) => { const P = PANELS[k];
    const pn = el("pn", "", M + (i % cols) * (pw + gx), 0, pw); pn.dataset.panel = k;
    const t = titleline(P, sq, pn, sq ? 26 : 0);
    const sb = subline(P, sq, pn);
    const used = sb.offsetTop + sb.offsetHeight + (sq ? 12 : 22);
    const nh = NOTE(P, sq); const nt = nh ? el("note abs", nh, 0, 0, pw, pn) : null;
    const hb = P.rows.length * z.pitch;
    return { k, pn, used, nt, hb, need: used + hb + (nt ? nt.offsetHeight + 8 : 0) }; });
  const rowH = [...Array(nr)].map((_, r) => Math.max(...P0.slice(r * cols, r * cols + cols).map(p => p.need)));
  const gy = (bot - top - rowH.reduce((a, b) => a + b, 0)) / (nr - 1);
  let y = top;
  rowH.forEach((h, r) => { P0.slice(r * cols, r * cols + cols).forEach(p => {
      p.pn.style.top = y + "px"; p.pn.style.height = h + "px";
      const by = p.used + (h - p.need) / 2;
      bars(p.k, p.pn, 0, by, pw, z); if (p.nt) p.nt.style.top = (by + p.hb + 8) + "px"; });
    y += h + gy; });
}
function list(W, H) {
  const M = 64, sq = H / W > 0.9;
  const top = header(W, sq) + (sq ? 22 : 34), bot = footer(W, H) - (sq ? 18 : 30);
  const z = sq ? { lab: 22, val: 22, bar: 18, pitch: 25 } : { lab: 24, val: 24, bar: 22, pitch: 30 };
  z.labW = labW(ORDER, z.lab);
  const lw = sq ? 470 : 700, bx = M + lw + (sq ? 30 : 60), bw = W - M - bx;
  // measure each metric's text block, then share the free height
  const blocks = ORDER.map(k => { const P = PANELS[k]; const pn = el("pn", "", M, 0, lw); pn.dataset.panel = k;
    const t = titleline(P, sq, pn, sq ? 24 : 28);
    const sb = subline(P, sq, pn); if (sq) sb.style.marginTop = "2px";
    if (P.note) el("ps", NOTE(P, sq), null, null, 0, pn).classList.add("note");
    return { k, pn, h: Math.max(pn.offsetHeight, P.rows.length * z.pitch) }; });
  const free = (bot - top) - blocks.reduce((a, b) => a + b.h, 0), gap = free / (blocks.length - 1);
  let y = top;
  blocks.forEach((b, i) => {
    b.pn.style.top = y + "px"; b.pn.style.height = b.h + "px";
    const hb = PANELS[b.k].rows.length * z.pitch;
    const bb = el("pn", "", bx, y + (b.h - hb) / 2, bw); bb.dataset.panel = b.k + "_bars"; bb.style.height = hb + "px";
    bars(b.k, bb, 0, 0, bw, z);
    if (i < blocks.length - 1) { const sp = el("sep", "", M, y + b.h + gap / 2, W - 2 * M); }
    y += b.h + gap;
  });
}
function build(W, H, layout) {
  Object.assign(st.style, { width: W + "px", height: H + "px" }); st.innerHTML = "";
  (layout === "list" ? list : grid)(W, H);
}
window.build = build;
const q = new URLSearchParams(location.search); if (q.get("layout")) build(innerWidth, innerHeight, q.get("layout"));
</script></body></html>
