function build(W, H) {

               : { tz: 44, bx: 480, bw: 760, bt: 388, bh: 300, pad: 26, sw: 26, wav: [110, 120], ex: 1290, rn: 170, th: 170, ts: [525, 220], tsy: 782, ly: 0, sm: [110, 160], lpx: 1000, vy: 900 };
