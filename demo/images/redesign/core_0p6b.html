<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>

</style></head><body><div id="stage"></div><script>
// 0.6B core vs the 115M default, same harnesses, same audio per row. Numbers: research/CORE_0P6B.md §results

const fmt = (t, step) => step < 1 ? t.toFixed(1) : String(Math.round(t));
const show = (v, d) => d === undefined ? String(v) : v.toFixed(d);
function chart(c, x, y, w, h, spec, o) {

    const vl = el("val" + (kind === "us" ? " us" : ""), show(v, spec.dec), 0, 0, c); place(vl, cx[i], pb - bh - 4, 0.5, 1); tops.push(pb - bh - 4 - vl.offsetHeight);
  });

  place(el("dl" + (Math.abs(rel) < 0.5 ? " tie" : better ? "" : " bad"), txt, 0, 0, c), (cx[0] + cx[1]) / 2, yb - 4, 0.5, 1);

}
const CARDS = {
  wer: { title: "Words: speech-to-text error", plain: "Far fewer wrong words in meetings and on calls. Clean read speech: a tie.", fn: "WER, lower is better · AMI-200 · ICSI-200 · 32 live two-party calls, the user’s own channel", lower: true,
    charts: [{ name: "AMI meetings", unit: "WER %", lower: true, ours: 11.2, other: 24.4, dec: 1 },
             { name: "ICSI meetings", unit: "WER %", lower: true, ours: 14.4, other: 27.3, dec: 1 },
             { name: "Live calls, your words", unit: "WER %", lower: true, ours: 7.7, other: 17.1, dec: 1 }] },
  spk: { title: "Who is talking", plain: "Better voice matching, slightly better speaker tracking, VAD a tie.", fn: "AMI meetings · speaker EER, same recipe on both · target-speaker tracking F1 · VAD F1 at threshold 0.5", lower: false,
    charts: [{ name: "Speaker ID error", unit: "EER, %", lower: true, ours: 13.6, other: 17.4, dec: 1 },
             { name: "Tracking F1", unit: "target speaker", lower: false, ours: 0.760, other: 0.743, dec: 3, domain: [0.6, 0.8, 0.1] },
             { name: "VAD F1", unit: "speech vs silence", lower: false, ours: 0.951, other: 0.951, dec: 3, domain: [0.8, 1.0, 0.1] }] },
  eot: { title: "Turn-taking: speech to an agent", plain: "Not better: slightly less accurate and slower to answer. The 115M keeps this job.", fn: "assistant preset · smart‑turn’s 399 public test clips · same clips for both", lower: true,
    charts: [{ name: "Accuracy", unit: "% of clips right", lower: false, ours: 91.2, other: 92.2, dec: 1, domain: [0, 100, 50] },
             { name: "End-of-turn latency", unit: "median, ms", lower: true, ours: 374, other: 292 },
             { name: "False fires", unit: "% of unfinished sentences", lower: true, ours: 7.1, other: 5.4, dec: 1 }] },
  cost: { title: "Cost to run", plain: "3 to 4× heavier. Real-time streams on this Mac: 1 vs 4 on CPU, 3 vs 5 on GPU.", fn: "full engine, ms of compute per 160 ms of audio · peak memory · Apple M-series laptop", lower: true,
    charts: [{ name: "Compute, Mac GPU (MPS)", unit: "ms per chunk", lower: true, ours: 39.3, other: 28.7, dec: 1 },
             { name: "Compute, 2 CPU threads", unit: "ms per chunk", lower: true, ours: 95.7, other: 29.8, dec: 1 },
             { name: "Memory", unit: "GB, peak", lower: true, ours: 5.0, other: 1.1, dec: 1 }] },
};
function card(k, x, y, w, h) {
  const C = CARDS[k], c = el("card", "", x, y); Object.assign(c.style, { width: w + "px", height: h + "px" });
  const P = 30, iw = w - 2 * P, T = 18;
  const t = el("ct", C.title, P, T, c);
  const p = wrap(el("plain", C.plain, P, T + t.offsetHeight + 4, c), iw);
  const f = wrap(el("fn", C.fn, P, 0, c), iw); f.style.top = (h - 14 - f.offsetHeight) + "px";
  let top = p.offsetTop + p.offsetHeight + 10;
  const lower = C.charts.every(sp => sp.lower), higher = C.charts.every(sp => !sp.lower);
  if (lower || higher) place(el("lg", lower ? "lower is better" : "higher is better", 0, 0, c), P + iw, t.offsetTop + t.offsetHeight - 3, 1, 1);
  const bot = f.offsetTop - 10, n = C.charts.length, gap = 30, cw = (iw - gap * (n - 1)) / n;
  let hdr = 0; C.charts.forEach(sp => { const a = wrap(el("ph", sp.name, 0, 0, c), cw), b = wrap(el("pu", sp.unit, 0, 0, c), cw); hdr = Math.max(hdr, a.offsetHeight + b.offsetHeight); a.remove(); b.remove(); });
  const O = { hdr, bw: 72 }, probe = document.createElement("div"); c.appendChild(probe);
  O.ph = Math.min(...C.charts.map((sp, i) => chart(probe, P + i * (cw + gap), top, cw, bot - top, sp, { ...O, probe: true }))); probe.remove();
  C.charts.forEach((sp, i) => chart(c, P + i * (cw + gap), top, cw, bot - top, sp, O));
  const sv = document.createElementNS("http://www.w3.org/2000/svg", "svg"); sv.setAttribute("width", w - 4); sv.setAttribute("height", h - 4);
  Object.assign(sv.style, { position: "absolute", left: 0, top: 0, overflow: "visible" }); sv.innerHTML = svg.join(""); svg = []; c.prepend(sv);
}
function build(W, H) {
  Object.assign(st.style, { width: W + "px", height: H + "px" }); st.innerHTML = ""; svg = [];
  const M = 64;
  const h1 = el("h9", "0.6B core vs the 115M default", M, M); h1.style.fontSize = "48px";
  const sub = wrap(el("s9", "Every head retrained on NVIDIA Nemotron Speech Streaming EN 0.6B, then the same tests on the same audio as the 115M. Green: the 0.6B is better. Red: worse.", M, 0), W - 2 * M);
  place(sub, M, h1.offsetTop + h1.offsetHeight + 6);
  const lg = el("lg", `<span class="sw" style="background:${css("--ours")}"></span><b>0.6B core</b>&nbsp;&nbsp;&nbsp;&nbsp;<span class="sw" style="background:${GREY}"></span>115M core (the default)`, 0, 0);
  lg.style.fontSize = "24px"; place(lg, W - M, h1.offsetTop + h1.offsetHeight - 6, 1, 1);
  const f = wrap(el("f9", "Verdict: much better transcripts, not better at knowing when you finished, 3–4× the cost. The 115M stays the default; <b>--core 0.6b</b> is opt-in. Full table with confidence intervals: research/CORE_0P6B.md.", M, 0), W - 2 * M);

const q = new URLSearchParams(location.search); if (q.get("w")) build(+q.get("w"), +q.get("h"));
</script></body></html>
