const FOOT_S_SQ = "For engineers: FastConformer 109 M, cache-aware, log-mel 80, ×8 subsampling, RNNT · heads: VAD 33 K (all layers), speaker 0.5 M and TS-VAD 0.26 M (layer 4), turn 0.32 M GRU on a pass conditioned on your voice track · --turn-input tsvad --diar-off";
const PILLS = {

  C: ["Is your turn over?", "a second pass of the same model, fed your voice track; an end-of-turn probability every 80 ms"] };
const PILLS_SQ = { A: PILLS.A, B: ["Is it you speaking?", "every 80 ms, from your 5-second voice sample; reads layer 4"], C: ["Is your turn over?", "second pass fed your voice track; end-of-turn probability every 80 ms"] };

function pill(k, x, y, w, qz) { const [q, c] = (SQP ? PILLS_SQ : PILLS)[k];
