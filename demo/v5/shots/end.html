<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.brand { font-size: 176px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.0; text-align: center; }
.l1 { font-size: 64px; font-weight: 700; line-height: 1.15; color: var(--ink); text-align: center; }
.l2 { font-size: 48px; line-height: 1.2; text-align: center; }
.url { font-size: 44px; font-weight: 700; line-height: 1.25; color: var(--ink); text-align: center; }
</style></head><body><script src="common.js"></script><script src="numbers_b.js"></script><script src="charts_b.js"></script><script>
// End card: brand, where it runs, open code and benchmarks, the repo; a flat animated waveform in the audioforge colour. No claims, no numbers.
let els = [], wave, bars = [];
function init(data, params, W, H) {
  const sq = H / W > 0.9;
  const ct = B.setup(W, H, "", 1.025);
  const bx = B.box;
  const col = B.abs(U.el("div", null, ct), { left: bx.x0, top: bx.y0, width: bx.w, height: bx.h, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: sq ? "22px" : "26px" });
  const brand = U.el("div", "brand h1", col, "audioforge"); if (sq) brand.style.fontSize = "150px"; brand.style.color = B.C.ours;
  wave = U.el("div", null, col); U.css(wave, { width: bx.w * (sq ? 0.96 : 0.9), height: sq ? 190 : 250, display: "flex", alignItems: "center", justifyContent: "space-between", margin: "8px 0 10px" });
  wave.setAttribute("data-primary", "");
  const N = sq ? 56 : 88;
  for (let i = 0; i < N; i++) { const b = U.el("i", null, wave); U.css(b, { display: "block", width: (bx.w * (sq ? 0.96 : 0.9)) / N * 0.5, height: 10, borderRadius: 999, background: B.C.ours }); bars.push(b); }
  const l1 = U.el("div", "l1", col, "Works inside Pipecat and LiveKit");
  const l2 = U.el("div", "l2", col, "open code, open benchmarks"); l2.style.color = B.C.muted;
  const url = U.el("div", "url", col, sq ? "github.com/maxmelichov/<br>audioforge" : "github.com/maxmelichov/audioforge");
  els = [[brand, -1], [l1, -1], [l2, -1], [url, -1]];   // the wordmark is there from the first frame
}
function render(t, ctx) {
  B.frame(t, ctx);
  for (const [e, t0] of els) { const a = U.ease(U.seg(t, t0, 0.4)); e.style.opacity = a; e.style.transform = `translateY(${(1 - a) * 24}px)`; }
  // a calm speech-like waveform: an envelope travelling left to right plus two slow carriers (pure function of t)
  const n = bars.length, grow = 1;
  bars.forEach((b, i) => {
    const x = i / (n - 1);
    const env = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * (x * 1.3 - t * 0.35)), 2);
    const car = 0.55 + 0.25 * Math.sin(i * 0.9 + t * 5.1) + 0.2 * Math.sin(i * 2.3 - t * 3.7);
    const edge = Math.sin(Math.PI * x);                     // taper at both ends
    const h = Math.max(10, wave.clientHeight * env * car * (0.35 + 0.65 * edge) * grow);
    b.style.height = h.toFixed(1) + "px";
    b.style.opacity = (0.45 + 0.55 * env).toFixed(3);
  });
}
window.init = init; window.render = render;
</script></body></html>
