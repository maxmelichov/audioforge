<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>

.sb { font-size: 30px; color: var(--muted); white-space: nowrap; }
.you { position: absolute; left: 36px; font-size: 32px; font-weight: 700; color: var(--amber); }
.tx { position: absolute; left: 36px; right: 36px; font-size: 44px; line-height: 1.25; overflow: hidden; color: var(--muted); }
.bub { position: absolute; right: 44px; min-height: 96px; border-radius: 40px 40px 12px 40px; background: var(--lav); display: flex; align-items: center; padding: 14px 26px; gap: 16px; color: var(--navy); font-size: 32px; line-height: 1.2; font-weight: 700; white-space: nowrap; }
.bub .bars { flex: none; }
.bub .bars { display: flex; align-items: center; gap: 7px; height: 56px; }
.bub .bars i { display: block; width: 9px; border-radius: 5px; background: var(--navy); }

.tag { position: absolute; right: 44px; font-size: 32px; font-weight: 700; color: #FFFFFF; background: #1C1C1E; border: 3px solid var(--red); padding: 6px 18px; border-radius: 999px; white-space: nowrap; }

.row .n { font-size: 44px; font-weight: 700; flex: 1; white-space: nowrap; }
.row .s { font-size: 40px; font-weight: 700; padding: 6px 24px; border-radius: 999px; background: #1C1C1E; color: var(--muted); white-space: nowrap; }
.link { position: absolute; width: 6px; margin-left: -3px; background: var(--line); }
.pdot { position: absolute; width: 16px; height: 16px; border-radius: 50%; margin: -8px 0 0 -8px; background: var(--amber); }
</style></head><body><script src="common.js"></script><script>
// A real Pipecat default session on a phone-shaped call UI (16:9: phone + the live pipeline rows; 1:1: phone with
// the pipeline as a compact strip). Clip time follows the shot's segments: static before the clip, 1x during, held after.
let D, P, clip, sd, wave, tx, bub, tag, rows = [], links = [], pdots = [], timer, head, col;
const ROWS = [["Silero VAD", "vad"], ["Turn detector", "turn"], ["Whisper", "asr"], ["LLM + TTS", "agent"], ["Who is speaking?", "who"]];
function init(data, params, W, H) {
  D = data; P = params; const ct = stage(W, H); clip = D.clips[P.clip]; sd = clip.sides[P.panels.P];
  const M = S.M, top = M, bot = S.bottom;
  const wrap = U.el("div", null, ct); wrap.setAttribute("data-primary", ""); U.css(wrap, { position: "absolute", left: M, top, width: W - 2 * M, height: bot - top });
  const ph = S.sq ? bot - top - 118 : bot - top, pw = S.sq ? W - 2 * M : 700, py = S.sq ? 118 : 0;
  const phone = U.el("div", "phone", wrap); U.css(phone, { left: 0, top: py, width: pw, height: ph });
  const sc = U.el("div", "screen", phone); sc.dataset.panel = "phone"; U.el("div", "notch", sc);
  const hdr = U.el("div", "hdr", sc, `<div class="av"><svg width="54" height="54" viewBox="0 0 100 100"><path d="M18 22h64a8 8 0 0 1 8 8v34a8 8 0 0 1-8 8H46L28 86V72H18a8 8 0 0 1-8-8V30a8 8 0 0 1 8-8z" fill="#0B0B0C"/></svg></div><div><div class="nm">Voice agent</div><div class="sb">${S.sq ? "" : "Pipecat default · "}<span class="tm">0:00</span></div></div>`);
  timer = hdr.querySelector(".tm");
  const sw = pw - 28, sh = ph - 28;
  const wy = S.sq ? 200 : 176;   // no "You"/"Speaker" label: the subtitles name the speaker
  wave = makeWave(sc, S.sq ? 34 : 26, { left: 36, top: wy, width: sw - 72, height: 200 }, "var(--amber)");
  const ty = wy + 200 + 12;
  bub = U.el("div", "bub", sc, '<div class="edge"></div><div class="bars">' + Array.from({ length: 5 }, () => "<i></i>").join("") + '</div><div class="bt"></div>');
  tag = U.el("div", "tag", sc);
  const bubY = sh - 40 - 96, tagY = bubY - 56;
  U.css(bub, { bottom: 40, maxWidth: sw - 88 }); U.css(tag, { top: tagY }); window.BUBY = sh - 40;
  tx = U.el("div", "tx", sc); tx.dataset.clipok = "";
  if (S.sq) tx.style.display = "none";   // 1:1: the subtitles carry the words; the phone keeps the waveform and the reply
  else U.css(tx, { top: ty, height: tagY - 16 - ty });
  head = U.el("div", "h1", wrap); U.css(head, { position: "absolute", left: S.sq ? 0 : pw + 60, top: 0, fontSize: S.sq ? 84 : 96, whiteSpace: "nowrap" });
  // pipeline rows (16:9) or a 2x2 strip (1:1)
  col = U.el("div", null, wrap);
  if (!S.sq) {
    const cx = pw + 60, cw = W - 2 * M - cx; U.css(col, { position: "absolute", left: cx, top: 150, width: cw, height: ph - 150 });
    const rh = 108, gap = (ph - 150 - ROWS.length * rh) / (ROWS.length - 1);
    ROWS.forEach(([n], i) => { const r = U.el("div", "row", col, `<div class="n">${n}</div><div class="s"></div>`); U.css(r, { top: i * (rh + gap), height: rh }); rows.push(r);
      if (i < ROWS.length - 2) { const l = U.el("div", "link", col); U.css(l, { left: 80, top: i * (rh + gap) + rh, height: gap }); links.push([i * (rh + gap) + rh, gap]); } });
    for (let i = 0; i < 24; i++) { const d = U.el("div", "pdot", col); d.style.left = "80px"; pdots.push(d); }
  } else {
    // 1:1: the speaker state sits in the call header as a chip
    const r = U.el("div", "row", sc, `<div class="n">Speaker</div><div class="s"></div>`);
    U.css(r, { left: "auto", right: 36, top: 84, width: 380, height: 76, padding: "0 12px 0 22px", background: "#1C1C1E" });
    r.querySelector(".n").style.fontSize = "32px"; r.querySelector(".s").style.fontSize = "32px"; r.querySelector(".s").style.padding = "4px 14px";
    rows.push(r); rows.push(r);
  }
}
function clipState(ctx, t) {
  const sg = (ctx.segs || []).filter(s => s.kind === "clip")[0];
  if (!sg) return { at: t, phase: "during" };
  if (t < sg.start) return { at: sg.t0, phase: "before", sg };
  if (t <= sg.end) return { at: sg.t0 + (t - sg.start), phase: "during", sg };
  return { at: sg.t1, phase: "after", sg };
}
function render(t, ctx) {
  chrome(t, ctx);
  { const cs = (ctx.segs || []).find(s => s.kind === "clip" && t >= s.start && t <= s.end); drawSubs(clip.subs, cs ? cs.t0 + (t - cs.start) : 0, !!cs, () => "Speaker"); }
  const st = clipState(ctx, t), at = st.at;
  const turn = sd.user_turns.find(u => u[1] >= (st.sg ? st.sg.t0 : 0)) || sd.user_turns[0], [ua, ub] = turn, speaking = at >= ua && at <= ub;
  timer.textContent = `0:${String(Math.floor(at)).padStart(2, "0")}`;
  drawWave(wave, clip, at, true);
  const live = st.phase !== "before";
  // the default stack's text for this turn was not retained: no transcript in the phone (the subtitles carry the words)
  tx.style.display = "none";
  // the agent talking over the speaker at the recorded cut-in times (inside the clip window)
  const t0 = st.sg ? st.sg.t0 : 0, t1 = st.sg ? st.sg.t1 : 1e9;
  const evs = sd.cut_ins.filter(c => c >= t0 && c < t1), fired = live ? evs.filter(c => c <= at) : [];
  const last = fired[fired.length - 1];
  if (last == null) { bub.style.opacity = 0; tag.style.opacity = 0; }
  else {
    const ln = ((ctx.agent_lines || {}).P || []).find(x => Math.abs(x[0] - last) < 1e-3) || [last, "", 0];
    const vt = st.sg ? st.sg.t0 + (t - st.sg.start) : at, el = vt - last, a = U.ease(el / 0.07), speak = ln[2];
    const words = ln[1] ? ln[1].split(" ") : [], k = speak > 0 ? Math.max(1, Math.ceil(words.length * U.clamp(el / speak))) : 0;
    bub.querySelector(".bt").textContent = words.slice(0, k).join(" ");
    bub.querySelectorAll(".bars i").forEach((b, i) => b.style.height = (el < speak ? 10 + 40 * (0.5 + 0.5 * Math.sin(el * 11 + i * 0.9)) : 10) + "px");
    U.css(bub, { opacity: a, transform: `translateX(${(1 - a) * 60}px)` });
    tag.style.top = (window.BUBY - bub.offsetHeight - 56) + "px";   // the tag rides above the bubble (one or two lines)
    tag.textContent = fired.length > 1 ? `Interrupted the speaker · ${fired.length}×` : "Interrupted the speaker"; tag.style.opacity = a;
  }
  // headline: each state held >= 2 s
  const cutAt = fired.length ? st.sg.start + (fired[0] - t0) : null;
  // hold each headline >= 2 s: skip "She is still talking" when the first cut-in comes within 2 s of the clip start
  const firstCut = evs.length && st.sg ? st.sg.start + (evs[0] - t0) : null;
  const quick = firstCut != null && firstCut - st.sg.start < 2;
  const H = st.phase === "before" || (quick && t < firstCut) ? "A real call today" : (cutAt != null && t >= cutAt ? "…and the agent cuts in" : "Still talking…");
  head.textContent = H; head.style.color = "var(--ink)";
  // pipeline state
  const recent = fired.some(c => at - c >= 0 && at - c < 1.4);
  const writing = false;
  const vadOn = U.env(clip, at) > 0.12;
  const who = ctx.cues && ctx.cues.who != null ? U.seg(t, ctx.cues.who, 0.3) : 0;
  const all = [vadOn && live ? ["speech", "#FFFFFF"] : ["silence", null], recent ? ["“done” ✕", "#FF3B30"] : ["not yet", null],
               writing ? ["writing", "#FFFFFF"] : ["waiting…", null], recent ? ["talking over", "#FF3B30"] : ["idle", null], ["unknown", "#FFFFFF"]];
  const st5 = S.sq ? [all[4], all[4]] : all;
  rows.forEach((r, i) => { const [txt, bg] = st5[i]; const s = r.querySelector(".s"); s.textContent = txt; const red = bg === "#FF3B30"; s.style.background = red ? "#1C1C1E" : (bg || "#1C1C1E"); s.style.color = red ? "#FFFFFF" : (bg ? "#0B0B0C" : "var(--muted)"); s.style.border = red ? "3px solid #FF3B30" : "0"; r.style.borderColor = bg || "transparent"; });
  const wr = rows[rows.length - 1];
  const pulse = 0.5 + 0.5 * Math.sin(t * 4);   // the unknown speaker keeps pulsing (idle motion after the clip)
  wr.style.boxShadow = `0 0 ${(18 + 30 * Math.max(who, pulse * 0.6)).toFixed(1)}px rgba(255,184,77,${(0.25 + 0.4 * Math.max(who, pulse * 0.6)).toFixed(2)})`;
  if (S.sq) { wr.style.transform = `scale(${(1 + 0.05 * pulse).toFixed(3)})`; wr.style.transformOrigin = "100% 50%"; }
  // audio chunks flowing down the chain every 160 ms (16:9)
  if (!S.sq) {
    let used = 0; const k0 = Math.floor(t / 0.16), end = links[links.length - 1][0] + links[links.length - 1][1];
    for (let k = k0; k > k0 - 24 && used < pdots.length; k--) { const y = 108 + (t - k * 0.16) * 520; if (!links.some(([y0, h]) => y > y0 && y < y0 + h) || y > end) continue;
      U.css(pdots[used], { top: y, opacity: live ? 1 : 0.35, background: y > links[1][0] ? "#FFFFFF" : "#FFFFFF" }); used++; }
    for (let i = used; i < pdots.length; i++) pdots[i].style.opacity = 0;
  }
}
window.init = init; window.render = render;
</script></body></html>
