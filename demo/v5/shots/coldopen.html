<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.ttl { position: absolute; font-size: 56px; font-weight: 700; color: var(--fg); white-space: nowrap; }
.sub { position: absolute; font-size: 40px; color: var(--fg2); white-space: nowrap; }
.lname { position: absolute; font-size: 40px; font-weight: 700; color: var(--fg); white-space: nowrap; }
.lrole { position: absolute; font-size: 30px; color: var(--fg2); white-space: nowrap; }
.lane { position: absolute; border-top: 2px solid var(--rule); }
.wbar { position: absolute; background: var(--user); border-radius: 3px; }
.abar { position: absolute; background: var(--pipecat); border-radius: 3px; }
.tag { position: absolute; font-size: 32px; font-weight: 700; color: #FFFFFF; background: #1C1C1E; border: 3px solid var(--red); padding: 2px 14px; border-radius: 8px; white-space: nowrap; }
.tick { position: absolute; width: 3px; background: var(--red); }
.play { position: absolute; width: 3px; background: #FFFFFF; }
.cnt { position: absolute; text-align: right; white-space: nowrap; }
.cnt .v { font-size: 120px; font-weight: 700; line-height: 1; color: #FFFFFF; border-bottom: 6px solid var(--red); padding-bottom: 6px; }
.cnt .l { font-size: 34px; color: var(--fg2); margin-top: 14px; }
.wd { position: absolute; font-size: 44px; color: var(--fg); white-space: nowrap; overflow: hidden; }
.node { position: absolute; border-radius: 18px; background: var(--surface2); border: 3px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.node .n { font-size: 40px; font-weight: 700; color: var(--fg); white-space: nowrap; }
.node .p { font-size: 32px; font-weight: 700; margin-top: 10px; padding: 2px 16px; border-radius: 999px; background: #0B0B0C; color: var(--fg2); white-space: nowrap; }
.arr { position: absolute; height: 3px; background: var(--rule); }
</style></head><body><script src="common.js"></script><script>
// Cold open (pattern: open on the failure; R1 cold open, R2 two-lane timeline): a real call through Pipecat's default
// stack as two lanes on a time axis (Caller: the real waveform with its words; Agent: when the default agent talked,
// at the recorded cut-in times), a red CUT IN tag at each cut-in, then the lanes shrink and the default chain appears
// as one thin row with only the turn detector lit ("done ✗") and Whisper "waiting".
let D, P, R, sd, E = {}, bars = [], abars = [], tags = [], ticks = [], G;
function init(data, params, W, H) {
  D = data; P = params; const ct = stage(W, H); R = D.clips[P.clip]; sd = R.sides.P;
  const M = S.M, sq = S.sq, x0 = sq ? M : M + 250, x1 = W - M - (sq ? 0 : 230);
  G = { x0, x1, cy0: sq ? 260 : 250, ch: sq ? 230 : 300, ay0: sq ? 560 : 620, ah: sq ? 110 : 140 };
  const pr = U.el("div", null, ct); pr.setAttribute("data-primary", ""); U.css(pr, { position: "absolute", left: M, top: M, width: W - 2 * M, height: S.bottom - M });
  E.ttl = U.el("div", "ttl", ct, "Pipecat's default, a real call"); U.css(E.ttl, { left: M, top: M, fontSize: sq ? 48 : 56 });
  E.sub = U.el("div", "sub", ct, "Silero VAD · smart-turn · Whisper"); U.css(E.sub, { left: M, top: M + (sq ? 62 : 74), fontSize: sq ? 34 : 40 });
  E.cnt = U.el("div", "cnt", ct, `<div class="v">0</div><div class="l">cut-ins</div>`); U.css(E.cnt, { right: M + 16, top: M + 16 });
  if (sq) E.cnt.querySelector(".v").style.fontSize = "96px";
  E.cl = U.el("div", "lname", ct, "Caller"); E.cr = U.el("div", "lrole", ct, "real audio");
  E.al = U.el("div", "lname", ct, "Agent"); E.ar = U.el("div", "lrole", ct, "Pipecat default");
  E.cane = U.el("div", "lane", ct); E.aane = U.el("div", "lane", ct);
  const n = sq ? 90 : 150; for (let i = 0; i < n; i++) bars.push(U.el("div", "wbar", ct));
  E.wd = U.el("div", "wd", ct); E.wd.dataset.clipok = "";
  for (const c of sd.cut_ins) { if (c < R.t0 || c >= R.t1) continue; ticks.push([U.el("div", "tick", ct), c]); tags.push([U.el("div", "tag", ct, "CUT IN"), c]); }
  for (const ln of (R.agent_voice && R.agent_voice.P) || []) abars.push([U.el("div", "abar", ct), ln.t, ln.t + ln.dur]);
  E.play = U.el("div", "play", ct);
  // the default chain (phase 2)
  const names = [["Silero VAD", "silence"], ["smart-turn", "done ✗"], ["Whisper", "waiting"], ["LLM", "idle"], ["TTS", "talking"]];
  E.nodes = names.map(([nm, p]) => U.el("div", "node", ct, `<div class="n">${nm}</div><div class="p">${p}</div>`));
  E.arrs = [0, 1, 2, 3].map(() => U.el("div", "arr", ct));
  const env = []; const nb = bars.length;
  for (let i = 0; i < nb; i++) { const a = R.t0 + (R.t1 - R.t0) * i / nb, b = R.t0 + (R.t1 - R.t0) * (i + 1) / nb; let m = 0; for (let tt = a; tt < b; tt += R.hop) m = Math.max(m, U.env(R, tt)); env.push(m); }
  const mx = Math.max(1e-6, ...env); G.env = env.map(v => Math.pow(v / mx, 0.7));
}
function clipState(ctx, t) {
  const sg = (ctx.segs || []).filter(s => s.kind === "clip")[0];
  if (!sg) return { at: R.t0 + t, phase: "during", sg: null };
  if (t < sg.start) return { at: R.t0, phase: "before", sg };
  if (t <= sg.end) return { at: sg.t0 + (t - sg.start), phase: "during", sg };
  return { at: sg.t1, phase: "after", sg };
}
function render(t, ctx) {
  chrome(t, ctx);
  const st = clipState(ctx, t), at = st.at, sq = S.sq;
  // phase 2 begins with the second narration line: lanes shrink to the top, the chain row appears below
  const says = (ctx.segs || []).filter(s => s.kind === "say"), p2t = says.length > 1 ? says[1].start - 0.2 : 1e9;
  const k = U.ease(U.seg(t, p2t, 0.6));
  const sc = 1 - 0.4 * k, top = U.lerp(G.cy0, sq ? 250 : 240, k);
  const cy = top, ch = G.ch * sc, ay = cy + ch + (G.ay0 - G.cy0 - G.ch) * sc, ah = G.ah * sc;
  const X = tt => G.x0 + (G.x1 - G.x0) * (tt - R.t0) / (R.t1 - R.t0);
  const lx = S.M;
  U.css(E.cl, { left: sq ? G.x0 : lx, top: sq ? cy - 50 : cy + ch / 2 - 44, fontSize: sq ? 34 : 40 }); U.css(E.cr, { left: lx, top: cy + ch / 2 + 4, fontSize: 30 }); E.cr.style.display = sq ? "none" : "block";
  U.css(E.al, { left: sq ? G.x0 : lx, top: sq ? ay - 50 : ay + ah / 2 - 44, fontSize: sq ? 34 : 40 }); U.css(E.ar, { left: lx, top: ay + ah / 2 + 4, fontSize: 30 }); E.ar.style.display = sq ? "none" : "block";
  U.css(E.cane, { left: G.x0, top: cy + ch / 2, width: G.x1 - G.x0 }); U.css(E.aane, { left: G.x0, top: ay + ah / 2, width: G.x1 - G.x0 });
  // caller waveform: real envelope, bright up to the playhead
  const nb = bars.length, bw = (G.x1 - G.x0) / nb;
  bars.forEach((b, i) => { const h = Math.max(4, G.env[i] * ch * 0.95); const tt = R.t0 + (R.t1 - R.t0) * (i + 0.5) / nb;
    U.css(b, { left: G.x0 + i * bw + bw * 0.2, width: bw * 0.6, top: cy + ch / 2 - h / 2, height: h }); b.style.opacity = st.phase === "before" ? 0.35 : (tt <= at ? 1 : 0.3); });
  // agent lane: when the default agent talked (recorded cut-in times)
  abars.forEach(([e, a, b]) => { const vis = st.phase !== "before" && at >= a; const bb = Math.min(b, at);
    U.css(e, { left: X(a), width: Math.max(0, X(bb) - X(a)), top: ay + ah * 0.2, height: ah * 0.6 }); e.style.opacity = vis ? 1 : 0; });
  let cuts = 0;
  ticks.forEach(([e, c]) => { const on = st.phase !== "before" && at >= c; U.css(e, { left: X(c) - 1, top: cy - 8, height: ay + ah - cy + 8 }); e.style.opacity = on ? 1 : 0; if (on) cuts++; });
  tags.forEach(([e, c], i) => { const on = st.phase !== "before" && at >= c; U.css(e, { left: Math.min(X(c) - 4, G.x1 - e.offsetWidth), top: cy - 58, fontSize: sq ? 28 : 32 }); e.style.opacity = on ? 1 : 0; });
  E.cnt.querySelector(".v").textContent = cuts;
  U.css(E.play, { left: X(at), top: cy - 10, height: ay + ah - cy + 20 }); E.play.style.opacity = st.phase === "during" ? 1 : 0;
  // the caller's words under the lane (automatic transcript), fixed style
  const ws = (R.subs || []).filter(w => w[0] <= at).map(w => w[2]);
  let kk = Math.min(9, ws.length); E.wd.textContent = ws.slice(-kk).join(" ");
  while (kk > 1 && E.wd.scrollWidth > E.wd.clientWidth + 1) { kk--; E.wd.textContent = ws.slice(-kk).join(" "); }
  U.css(E.wd, { left: G.x0, top: ay + ah + (sq ? 14 : 24), width: G.x1 - G.x0, fontSize: 44 }); E.wd.style.opacity = (1 - k).toFixed(3);
  // the chain row
  const rowY = sq ? 660 : 660, rowH = sq ? 130 : 150, gap = sq ? 18 : 40, nw = ((S.W - 2 * S.M) - 4 * gap) / 5;
  E.nodes.forEach((e, i) => { U.css(e, { left: S.M + i * (nw + gap), top: rowY + (1 - k) * 40, width: nw, height: rowH }); e.style.opacity = (k * (i === 1 || i === 2 ? 1 : 0.35)).toFixed(3);
    e.querySelector(".n").style.fontSize = (sq ? 30 : 40) + "px"; const p = e.querySelector(".p"); p.style.fontSize = (sq ? 28 : 32) + "px";
    if (i === 1) { e.style.borderColor = "#FF3B30"; p.style.border = "3px solid #FF3B30"; p.style.color = "#FFFFFF"; }
    if (i === 2) { p.style.color = "#FFFFFF"; p.style.opacity = (0.75 + 0.25 * Math.sin(t * 5)).toFixed(3); } });
  E.arrs.forEach((e, i) => { U.css(e, { left: S.M + (i + 1) * (nw + gap) - gap + 6, top: rowY + (1 - k) * 40 + rowH / 2, width: gap - 12 }); e.style.opacity = (0.5 * k).toFixed(3); });
}
window.init = init; window.render = render;
</script></body></html>
