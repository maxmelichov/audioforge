<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>svg text { font-family: var(--font); }</style></head><body><script src="common.js"></script><script src="numbers_b.js"></script><script src="charts_b.js"></script><script>
// Final transcript: AMI meetings, Whisper-normalised WER (runs/hybrid_asr.json, runs/final_asr.json via numbers_b.js).
// Our stack's final transcript (NVIDIA Parakeet-TDT rewriting each finished turn) vs Whisper small, the transcriber of the
// default Pipecat and LiveKit stacks. Whisper turbo and Parakeet-CTC: fine print only. Never our streaming WER.
const n = B.n, s = B.s, r = B.row;
panelChart({
  title: "Fewer word errors in the final transcript",
  takeaway: () => `The audioforge stack gets ${s("wer/ours")} % of words wrong; Whisper small, the default stacks' transcriber, ${s("wer/whisper_small")} %`,
  setup: () => "Same meeting recordings, final transcripts",
  panels: () => [{ unit: " %", bh: S.sq ? 56 : 104, vsize: S.sq ? 120 : 128, lsize: S.sq ? 52 : 60, mode: S.sq ? "above" : "left",
    rows: [r("audioforge stack", "wer/ours", { ours: true }), r("Whisper small", "wer/whisper_small", { fill: B.C.pipecat })] }],
  fine: () => `Word error rate, ${n("wer/n")} AMI dev segments, Whisper-normalised; audioforge stack = NVIDIA Parakeet-TDT 0.6B v3 rewriting each finished turn; Whisper small = the transcriber of the default Pipecat and LiveKit stacks; also Whisper turbo ${s("wer/whisper_turbo")} %, Parakeet-CTC ${s("wer/parakeet_ctc")} %; 95 % CI ${n("wer/ours/ci").join("–")} vs ${n("wer/whisper_small/ci").join("–")} % · runs/hybrid_asr.json, runs/final_asr.json`,
  fineSq: () => `WER, ${n("wer/n")} AMI dev segments; audioforge stack = NVIDIA Parakeet-TDT 0.6B v3 per finished turn; Whisper small = default stacks · runs/hybrid_asr.json, final_asr.json`,
});
</script></body></html>
