<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.tile { position: absolute; background: var(--panel); border: 3px solid var(--line); border-radius: 34px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 16px 26px; }
.tile .ic { width: 130px; height: 130px; margin-bottom: 22px; }
.tile .nm { font-size: 48px; font-weight: 700; line-height: 1.08; }
.tile .sub { font-size: 30px; color: var(--muted); margin-top: 10px; line-height: 1.2; }
.sq .tile .q { font-size: 34px; }
.tile .q { font-size: 44px; line-height: 1.18; margin-top: auto; color: var(--ink); }
.edge { position: absolute; height: 6px; border-radius: 3px; background: var(--line); transform-origin: 0 50%; }
.dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; margin: -11px 0 0 -11px; }
.badge { position: absolute; background: var(--amber); color: var(--navy); font-size: 40px; font-weight: 700; padding: 12px 26px; border-radius: 999px; white-space: nowrap; }
.state { position: absolute; font-size: 44px; font-weight: 700; padding: 10px 0; border-radius: 22px; text-align: center; white-space: nowrap; background: #1C1C1E; color: var(--muted); }
.queue { position: absolute; border-radius: 12px; background: var(--amber); }
</style></head><body><script src="common.js"></script><script>
const ICON = {
  mic: '<svg viewBox="0 0 100 100"><rect x="36" y="10" width="28" height="52" rx="14" fill="#FFFFFF"/><path d="M24 46a26 26 0 0 0 52 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M50 72v16M36 90h28" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></svg>',
  vad: '<svg viewBox="0 0 100 100"><path d="M8 50h14l8-22 12 46 12-60 12 52 8-16h18" stroke="#8E8E93" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  turn: '<svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="34" stroke="#8E8E93" stroke-width="7" fill="none"/><path d="M50 54V32M50 54l14 10M40 12h20" stroke="#8E8E93" stroke-width="7" stroke-linecap="round"/></svg>',
  asr: '<svg viewBox="0 0 100 100"><rect x="12" y="18" width="76" height="64" rx="12" stroke="#8E8E93" stroke-width="7" fill="none"/><path d="M26 40h48M26 58h32" stroke="#8E8E93" stroke-width="7" stroke-linecap="round"/></svg>',
  llm: '<svg viewBox="0 0 100 100"><path d="M18 22h64a8 8 0 0 1 8 8v34a8 8 0 0 1-8 8H46L28 86V72H18a8 8 0 0 1-8-8V30a8 8 0 0 1 8-8z" stroke="#8E8E93" stroke-width="7" fill="none" stroke-linejoin="round"/><circle cx="34" cy="47" r="5" fill="#8E8E93"/><circle cx="50" cy="47" r="5" fill="#8E8E93"/><circle cx="66" cy="47" r="5" fill="#8E8E93"/></svg>',
  tts: '<svg viewBox="0 0 100 100"><path d="M14 38h16l20-16v56L30 62H14z" fill="#8E8E93"/><path d="M64 34a22 22 0 0 1 0 32M74 24a36 36 0 0 1 0 52" stroke="#8E8E93" stroke-width="7" fill="none" stroke-linecap="round"/></svg>',
};
const NODES = [
  { k: "mic", nm: "Mic", sub: "the user", q: "" },
  { k: "vad", nm: "Silero VAD", sub: "voice activity", q: "Is anyone speaking?" },
  { k: "turn", nm: "Turn detector", sub: "smart-turn or LiveKit", q: "Is the turn over?" },
  { k: "asr", nm: "Whisper", sub: "speech to text", q: "The words" },
  { k: "llm", nm: "LLM", sub: "the brain", q: "The answer" },
  { k: "tts", nm: "TTS", sub: "the voice", q: "Speaks" },
];
let D, P, T = [], E = [], dots = [], head, queue, wave, clip;
const PAUSE = 3.3;          // the user pauses: the turn detector says "over", Whisper writes, the LLM and TTS follow
function init(data, params, W, H) {
  D = data; P = params; const ct = stage(W, H); document.body.classList.toggle("sq", S.sq); clip = D.clips["ami_TS3004b_064"];
  const M = S.M, top = M, bottom = S.bottom;
  head = U.el("div", "h1", ct, S.sq ? "How agents listen today" : "How voice agents listen today"); U.css(head, { position: "absolute", left: M, top: top, whiteSpace: "nowrap", fontSize: S.sq ? 84 : 104 });
  const n = NODES.length, cols = S.sq ? 3 : 6, rowsN = S.sq ? 2 : 1, gap = S.sq ? 30 : 58, vgap = 34;
  const y0 = top + (S.sq ? 130 : 160), y1 = bottom - 6;
  const tw = (W - 2 * M - gap * (cols - 1)) / cols, th = (y1 - y0 - vgap * (rowsN - 1)) / rowsN;
  const pr = U.el("div", null, ct); pr.setAttribute("data-primary", ""); U.css(pr, { position: "absolute", left: M, top: y0, width: W - 2 * M, height: y1 - y0 });
  NODES.forEach((nd, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const t = U.el("div", "tile", ct, `${S.sq ? "" : `<div class="ic">${ICON[nd.k]}</div>`}<div class="nm">${nd.nm}</div>${S.sq ? "" : `<div class="sub">${nd.sub}</div>`}<div class="q">${nd.q}</div>`);
    const x = M + c * (tw + gap), y = y0 + r * (th + vgap);
    U.css(t, { left: x, top: y, width: tw, height: th, padding: S.sq ? "22px 14px 20px" : "30px 16px 26px" });
    nd.x = x; nd.w = tw; nd.y = y; nd.h = th; nd.cy = y + (S.sq ? 50 : 100); T.push(t);
    if (c < cols - 1 && i < n - 1) { const e = U.el("div", "edge", ct); U.css(e, { left: x + tw + 4, top: nd.cy - 3, width: gap - 8 }); E.push([e, i]); }
    else if (i < n - 1) { const e = U.el("div", "edge", ct); U.css(e, { left: M + tw / 2 - 3, top: y + th + 4, width: 6, height: vgap - 8, transformOrigin: "50% 0" }); E.push([e, i]); }
  });
  const mt = NODES[0];
  if (!S.sq) wave = makeWave(ct, 9, { left: mt.x + 26, top: y1 - 250, width: mt.w - 52, height: 210 }, "var(--amber)");
  else wave = makeWave(ct, 9, { left: mt.x + 22, top: mt.y + 80, width: mt.w - 44, height: mt.h - 110 }, "var(--amber)");
  for (let i = 0; i < 60; i++) { const d = U.el("div", "dot", ct); dots.push(d); }
  queue = U.el("div", "queue", ct);
  NODES.forEach((nd, i) => { if (i === 0) return; nd.st = U.el("div", "state", ct);
    const nm = T[i].querySelector(".nm"), below = nd.y + nm.offsetTop + nm.offsetHeight + 12;   // under the name, however many lines it takes
    U.css(nd.st, { left: nd.x + 14, width: nd.w - 28, top: S.sq ? below : nd.y + 400, fontSize: S.sq ? 40 : 44 }); });
}
function render(t, ctx) {
  chrome(t, ctx);
  // all six tiles build within 2 s; the mic tile is there from the first frame (poster frame)
  // the six tiles are on screen from the first frame; the chain builds by lighting each stage in turn within 2 s
  const appear = NODES.map((_, i) => i === 0 ? -1 : 0.1 + i * 0.3);
  head.style.opacity = 1;
  T.forEach((el, i) => { const a = U.ease(U.seg(t, appear[i], 0.3)); el.style.opacity = 0.55 + 0.45 * a; el.style.transform = `scale(${0.96 + 0.04 * a})`; });
  E.forEach(([el, i]) => { const a = U.ease(U.seg(t, appear[i + 1] - 0.1, 0.3)); el.style.transform = el.style.height && parseFloat(el.style.height) > 10 && parseFloat(el.style.width) < 10 ? `scaleY(${a})` : `scaleX(${a})`; });
  const at = 1.6 + t;
  drawWave(wave, clip, at, true, 1.6);
  // audio chunks every 160 ms travel along the first row's drawn edges; they pile up in front of Whisper until the pause
  const flush = PAUSE + 0.3, rowEnd = S.sq ? 2 : 5;
  let used = 0, queued = 0;
  for (let k = Math.max(0, Math.floor((t - 1.6) / 0.16)); k <= Math.floor(t / 0.16); k++) {
    const age = t - k * 0.16; if (age < 0) continue;
    let x = NODES[0].x + NODES[0].w + 4 + age * 900, col = "var(--amber)";
    let gapIdx = -1; for (let i = 0; i < rowEnd; i++) if (x > NODES[i].x + NODES[i].w + 4 && x < NODES[i + 1].x - 4) gapIdx = i;
    if (!S.sq && t < flush && x > NODES[3].x - 16) { queued++; continue; }
    if (gapIdx < 0 || t < appear[gapIdx + 1] + 0.2 || used >= dots.length) continue;
    if (gapIdx >= 3) col = "var(--ink)";
    U.css(dots[used], { left: x, top: NODES[0].cy, background: col, opacity: 1 }); used++;
  }
  for (let i = used; i < dots.length; i++) dots[i].style.opacity = 0;
  const qa = S.sq ? 0 : (t < flush ? U.seg(t, appear[3], 0.3) : 1 - U.seg(t, flush, 0.3));
  const qh = Math.min(260, 12 + queued * 6);
  U.css(queue, { left: NODES[3].x - 40, top: NODES[3].cy - qh / 2, width: 26, height: qh, opacity: qa });
  const dotsTxt = ".".repeat(1 + Math.floor(t * 3) % 3);
  const speech = U.env(clip, at) > 0.12 && t < PAUSE;
  const state = [null,
    speech ? ["speech", "#FFFFFF", "#0B0B0C"] : ["silence", "#A1A1A6", "#0B0B0C"],
    t < PAUSE ? ["not yet", "#A1A1A6", "#0B0B0C"] : ["over", "#FFFFFF", "#0B0B0C"],
    t < flush ? ["waiting", "#FFFFFF", "#0B0B0C"] : ["writing", "#FFFFFF", "#0B0B0C"],
    t < flush + 0.4 ? ["idle", "#A1A1A6", "#0B0B0C"] : ["thinking", "#FFFFFF", "#0B0B0C"],
    t < flush + 0.8 ? ["idle", "#A1A1A6", "#0B0B0C"] : ["speaking", "#FFFFFF", "#0B0B0C"]];
  NODES.forEach((nd, i) => { if (!i) return; const [txt, bg, fg] = state[i]; nd.st.textContent = txt;
    nd.st.style.background = bg; nd.st.style.color = fg; nd.st.style.opacity = U.seg(t, appear[i] + 0.3, 0.01) * (i === 3 && t < flush ? 0.8 + 0.2 * Math.sin(t * 5) : 1); });
  const pause = PAUSE;
  // tiles light up when they work
  const glow = (i, on, col) => { T[i].style.borderColor = on ? col : "var(--line)"; T[i].style.boxShadow = on ? `0 0 40px ${col}55` : "none"; };
  glow(0, true, "#FFFFFF");
  glow(1, t > appear[1] + 0.3 && U.env(clip, at) > 0.12, "#FFFFFF");
  glow(3, t > flush && t < flush + 1.2, "#FFFFFF");
  glow(4, t > flush + 0.4 && t < flush + 1.6, "#FFFFFF");
  glow(5, t > flush + 0.8, "#FFFFFF");
}
window.init = init; window.render = render;
</script></body></html>
