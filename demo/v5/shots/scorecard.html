<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.row { position: absolute; display: flex; align-items: center; gap: 24px; }
.ck { flex: none; border-radius: 50%; background: var(--cyan); display: flex; align-items: center; justify-content: center; }
.txt { display: flex; flex-direction: column; min-width: 0; }
.lab { font-size: 44px; line-height: 1.12; color: var(--ink); white-space: nowrap; }
.fig { font-size: 48px; line-height: 1.12; font-weight: 700; color: var(--cyan); }
</style></head><body><script src="common.js"></script><script src="numbers_b.js"></script><script src="charts_b.js"></script><script>
// Scorecard: every win the film shows as a row with a check and one plain figure (numbers_b.js, same values as the shots), one row per beat (params.beat, default 0.6 s = 100 BPM).
// One table of seven one-line rows in both formats, all visible together at the end (no scrolling).
const n = B.n, s = B.s, C = B.C;
function rowsData(sq) {
  // exactly the wins the film shows, each with the same numbers (numbers_b "shown") as its own shot.
  // 16:9: [what, figure]; 1:1: a short name and a short figure so all seven rows fit on one line each.
  if (n("icsi/fc_ratio") > 0.55) throw new Error("ICSI cut-offs are no longer half");
  const less = `${NB["live/cutins_less"].word} ${s("live/cutins_less")} %`;
  const ci = `${s("live/oto/ours/cutins")} vs ${s("live/oto/pipecat/cutins")}`;
  const un = `${s("live/oto/ours/unanswered")} % vs ${s("live/oto/livekit/unanswered")} % / ${s("live/oto/pipecat/unanswered")} %`;
  const fw = `${s("live/oto/ours/first")} s vs ${s("live/oto/pipecat/first")} s / ${s("live/oto/livekit/first")} s`;
  const pp = `${n("room/found")} of ${n("room/ref")} people`;
  const x = `${s("icsi/caught_ratio")}×`;
  const tb = `${s("tb/ours")} % vs ${s("tb/best")} %`;
  const wr = `${s("wer/ours")} % vs ${s("wer/whisper_small")} %`;
  return sq ? [
    [`Interrupts ${less} less`, `${ci} / min`],
    ["Unanswered turns", un],
    ["First words", fw],
    ["Knows who talks", pp],
    ["Unseen meetings", `${x} caught, ½ cut-offs`],
    ["Turn ends caught", tb],
    ["Word errors", wr],
  ] : [
    [`Interrupts ${less} less`, `${ci} a minute vs Pipecat default`],
    ["Answers when you finish", `${un} unanswered`],
    ["Words on screen while you speak", fw],
    ["Knows who is talking", `${pp} in a real meeting`],
    ["Holds on unseen meetings", `${x} as many turn ends, half the cut-offs`],
    ["Catches more turn ends", `${tb} (best framework detector)`],
    ["Final transcript beats Whisper", `${wr} word errors`],
  ];
}
const WORD = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
let R = [], sq, beat, T0 = 0.9, view;
function checkSvg(d) {
  return `<svg width="${d * 0.56}" height="${d * 0.56}" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="${C.navy}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function init(data, params, W, H) {
  sq = H / W > 0.9; beat = (params.params && params.params.beat) || params.beat || 0.6;
  const rows = rowsData(sq).map(([a, b]) => [B.nb(a), B.nb(b)]);
  const fine = sq
    ? `Real phone calls: ${n("live/oto/clips")} otoSpeech recordings live in Pipecat/LiveKit, audioforge = system C in Pipecat · unseen meetings: ICSI · detectors: TurnBench · transcript: AMI · sources on each chart; runs/*.json`
    : `Live rows: ${n("live/oto/clips")} real phone calls (otoSpeech) played through Pipecat and LiveKit, audioforge = system C in Pipecat, unanswered = no reply within 3 s · people: AMI IS1008b · unseen meetings: ICSI, ${n("icsi/horizon_s")} s · detectors: TurnBench, same false-alarm limit · transcript: AMI WER · runs/e2e_final.json, baselines_turn_icsi_dyn.json, turnbench_dev.json, hybrid_asr.json, final_asr.json`;
  const ct = B.setup(W, H, fine, sq ? 1.02 : 1.025);
  const bx = B.box;
  let y = B.header(ct, `${WORD[rows.length]} wins, measured on real audio`, null) + (sq ? 4 : 14);
  // one table, a row per win (check · what · figure on one line), all seven visible together at the end
  const cols = 1, per = rows.length, gap = 48;
  const cw = (bx.w - gap * (cols - 1)) / cols;
  const hAvail = bx.y1 - y;
  const cellH = hAvail / per;
  const d = Math.min(sq ? 48 : 64, cellH * 0.62);
  const labW = Math.max(...rows.map(([l]) => B.tw(l, 44))) + (sq ? 28 : 44);
  view = { y, h: hAvail, cellH, per };
  rows.forEach(([lab, fig], i) => {
    const c = sq ? 0 : Math.floor(i / per), k = sq ? i : i % per;
    const e = B.abs(U.el("div", "row", ct), { left: bx.x0 + c * (cw + gap), top: y + k * cellH, width: cw, height: cellH });
    const ck = U.el("div", "ck", e, checkSvg(d)); U.css(ck, { width: d, height: d });
    const tx = U.el("div", "txt", e);
    const lb = U.el("div", "lab", tx, lab);
    const fg = U.el("div", "fig", tx, fig);
    U.css(tx, { flexDirection: "row", alignItems: "baseline", gap: "0px" }); U.css(lb, { width: labW + "px", flex: "none" }); U.css(fg, { whiteSpace: "nowrap" });
    if (sq) { U.css(e, { gap: "16px" }); fg.style.fontSize = "44px"; }
    R.push({ e, ck, k, t: T0 + i * beat });
  });
  const prim = B.abs(U.el("div", null, ct), { left: bx.x0, top: y, width: bx.w, height: sq ? hAvail : per * cellH, pointerEvents: "none" }); prim.setAttribute("data-primary", "");
}
function render(t, ctx) {
  B.frame(t, ctx); B.headerAnim(t);
  const last = R[R.length - 1].t + 0.35;
  let off = 0;
  // no scrolling: every row stays in place
  R.forEach((r, i) => {
    const a = U.eout(U.seg(t, r.t, 0.3));
    let op = a;
    r.e.style.opacity = op.toFixed(3);
    r.e.style.transform = `translateX(${(1 - a) * 40}px)`;
    // after the last row: a highlight sweep down the checks (one row per 0.25 s, looping)
    const sweep = t > last ? ((t - last) / 0.25) % (R.length + 4) : -99;
    const glow = Math.max(0, 1 - Math.abs(sweep - i) / 1.5);
    const pop = U.seg(t, r.t, 0.15) * (1 - U.seg(t, r.t + 0.15, 0.25));
    r.ck.style.transform = `scale(${1 + 0.18 * pop + 0.1 * glow})`;
    r.ck.style.boxShadow = `0 0 ${10 + 30 * Math.max(glow, pop)}px rgba(72,214,255,${(0.35 + 0.5 * Math.max(glow, pop)).toFixed(2)})`;
  });
}
window.init = init; window.render = render;
</script></body></html>
