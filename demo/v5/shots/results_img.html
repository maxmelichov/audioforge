<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html, body { background: var(--bg, #0B0B0C); }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--bg, #0B0B0C) !important; }
.panel { position: absolute; display: flex; flex-direction: column; background: none; border-radius: 0; }
.title { font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.take { line-height: 1.2; margin-top: 0.35em; }
.rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
.row { display: grid; align-items: center; }
.lab { white-space: nowrap; line-height: 1.1; }
.cell { display: flex; align-items: center; min-width: 0; }
.bar { flex: none; border-radius: 6px; }
.val { white-space: nowrap; font-weight: 700; line-height: 1; }
.footer { position: absolute; line-height: 1.25; text-align: center; }
</style></head><body><script src="numbers_b.js"></script><script>
// Static result bar graphs (PNG, rendered by images_b.py). Flat near-black, white type, audioforge orange, defaults in
// greys; at most three thick horizontal bars per panel, the value at the bar end, a plain headline, a one-line takeaway,
// no axes / gridlines / legends; one plain footer line with the sources (no file paths). Every number is a numbers_b
// "shown" string (export_b.py <- runs/*.json, research/E2E_FINAL.md). URL: ?view=overview|unanswered|interrupts|first|wer
const css = (k, fb) => getComputedStyle(document.documentElement).getPropertyValue(k).trim() || fb;
const C = { bg: css("--bg", "#0B0B0C"), ink: "#FFFFFF", muted: css("--muted-2", "#A1A1A6"), ours: css("--ours", "#FF7A1A"),
            pipecat: css("--pipecat", "#8E8E93"), livekit: css("--livekit", "#636366") };
const NBv = k => { const e = NB[k]; if (!e) throw new Error("numbers_b has no " + k); return e; };
const s = k => { const e = NBv(k); if (e.shown == null) throw new Error("no shown value for " + k); return e.shown; };
const v = k => NBv(k).value;
const nb = str => String(str).replace(/(\d) (%|s|×|\/)/g, "$1 $2");
const row = (label, key, who, unit) => ({ label, v: v(key), txt: s(key), who, unit });
// a before -> after pair on one track: grey bar = before, orange bar on top = after
const pair = (label, kb, ka, unit) => ({ label, pair: true, v: v(kb), va: v(ka), txt: s(kb), txta: s(ka), who: "ours", unit });
const PANELS = {
  vad: { title: "Hears speech better",
    take: () => "Speech-detection score out of 100: edges NVIDIA's MarbleNet, clearly ahead of Silero",
    rows: () => [row("audioforge", "vad/ours", "ours", ""), row("NVIDIA MarbleNet", "vad/marblenet", "pipecat", ""), row("Silero", "vad/silero", "livekit", "")] },
  target: { title: "Follows your voice",
    take: () => "Missed turn ends before \u2192 after five seconds of your voice, with about the same false cut-offs",
    rows: () => [pair("AMI meetings", "ts/ami/before", "ts/ami/after", " %"), pair("ICSI meetings", "ts/icsi/before", "ts/icsi/after", " %")] },
  wer: { title: "Better transcript",
    take: () => "Word errors in meetings; the default stacks use Whisper small",
    rows: () => [row("audioforge", "wer/ours", "ours", " %"), row("Whisper small", "wer/whisper_small", "pipecat", " %")] },
  turn: { title: "Smarter end of turn",
    take: () => "Turn ends caught at the same false-alarm rate: more than the detector Pipecat ships",
    rows: () => [row("audioforge", "tb/ours", "ours", " %"), row("Silero timeout", "tb/silero", "pipecat", " %"), row("smart-turn (Pipecat)", "tb/smartturn", "livekit", " %")] },
  interrupts: { title: "Fewer interruptions",
    take: () => `Times a minute it talks over you: ${NBv("live/cutins_less").word} ${s("live/cutins_less")} % fewer`,
    rows: () => [row("audioforge", "live/oto/ours/cutins", "ours", " / min"), row("Pipecat default", "live/oto/pipecat/cutins", "pipecat", " / min")] },
  answers: { title: "Answers when you finish",
    take: () => `Turns with no reply within 3 s; your first words show in ${s("live/oto/ours/first")} s, not ${s("live/oto/pipecat/first")} s or ${s("live/oto/livekit/first")} s`,
    rows: () => [row("audioforge", "live/oto/ours/unanswered", "ours", " %"), row("LiveKit default", "live/oto/livekit/unanswered", "livekit", " %"),
                 row("Pipecat default", "live/oto/pipecat/unanswered", "pipecat", " %")] },
};
const ORDER = ["vad", "target", "wer", "turn", "interrupts", "answers"];
const TITLE = "audioforge: measured against the tools voice agents use today";
const FOOTER = () => `${v("live/oto/clips")} real phone calls (otoSpeech) through Pipecat ${s("version/pipecat")} and LiveKit Agents ${s("version/livekit")} with default settings · AMI and ICSI meetings (voice print: offline benchmark, the speaker track feeds the turn detector; false cut-offs: AMI ${s("ts/ami/before_fc")} \u2192 ${s("ts/ami/after_fc")} %, ICSI ${s("ts/icsi/before_fc")} \u2192 ${s("ts/icsi/after_fc")} %) · transcript by NVIDIA Parakeet-TDT in our stack · TurnBench calls, official scorer`;

function tw(str, size, weight) { const c = tw.c || (tw.c = document.createElement("canvas").getContext("2d")); c.font = `${weight} ${size}px ${getComputedStyle(document.body).fontFamily}`; return c.measureText(str).width; }
// one panel: title, takeaway, rows. z = type sizes; mode "left" (label left of the bar) or "above" (label over the bar)
function panel(parent, key, x, y, w, h, z, mode) {
  const P = PANELS[key], rows = P.rows();
  const el = document.createElement("div"); el.className = "panel"; el.dataset.panel = key;
  Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }); parent.appendChild(el);
  const t = document.createElement("div"); t.className = "title"; t.textContent = nb(P.title); Object.assign(t.style, { fontSize: z.title + "px", color: C.ink }); el.appendChild(t);
  const k = document.createElement("div"); k.className = "take"; k.textContent = nb(P.take()); Object.assign(k.style, { fontSize: z.take + "px", color: C.muted }); el.appendChild(k);
  const rs = document.createElement("div"); rs.className = "rows"; rs.style.marginTop = z.gap + "px"; el.appendChild(rs);
  const max = Math.max(...rows.map(r => r.v));
  const valW = Math.max(...rows.map(r => tw(nb(r.pair ? `${r.txt}${r.unit} \u2192 ${r.txta}${r.unit}` : r.txt + r.unit), z.val, 700))) + z.val * 0.3;
  const labW = mode === "left" ? Math.max(...rows.map(r => tw(r.label, z.lab, r.who === "ours" ? 700 : 400))) + z.lab * 0.7 : 0;
  const barMax = w - labW - valW;
  rows.forEach(r => {
    const rw = document.createElement("div"); rw.className = "row"; rs.appendChild(rw);
    rw.style.gridTemplateColumns = mode === "left" ? `${labW}px 1fr` : "1fr";
    const col = r.who === "ours" && !r.pair ? C.ours : C.ink;
    const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = r.label;
    Object.assign(lab.style, { fontSize: z.lab + "px", fontWeight: r.who === "ours" && !r.pair ? 700 : 400, color: col, marginBottom: mode === "above" ? z.lab * 0.25 + "px" : 0 }); rw.appendChild(lab);
    const cell = document.createElement("div"); cell.className = "cell"; rw.appendChild(cell);
    const bar = document.createElement("div"); bar.className = "bar";
    Object.assign(bar.style, { width: Math.max(12, barMax * r.v / max) + "px", height: z.bar + "px", background: r.pair ? C.pipecat : C[r.who], position: "relative" }); cell.appendChild(bar);
    if (r.pair) { const a = document.createElement("div"); Object.assign(a.style, { position: "absolute", left: 0, top: 0, height: z.bar + "px", borderRadius: "6px", width: Math.max(12, barMax * r.va / max) + "px", background: C.ours }); bar.appendChild(a); }
    const val = document.createElement("div"); val.className = "val"; Object.assign(val.style, { fontSize: z.val + "px", color: col, marginLeft: z.val * 0.22 + "px" }); cell.appendChild(val);
    if (r.pair) {
      const b0 = document.createElement("span"); b0.textContent = nb(r.txt + r.unit) + " \u2192 "; b0.dataset.final = r.txt; b0.style.color = C.ink; val.appendChild(b0);
      const b1 = document.createElement("span"); b1.textContent = nb(r.txta + r.unit); b1.dataset.final = r.txta; b1.style.color = C.ours; val.appendChild(b1);
    } else { val.textContent = nb(r.txt + r.unit); val.dataset.final = r.txt; }
  });
  return el;
}
function build(view, W, H) {
  const sq = H / W > 0.9, M = 64;
  document.body.innerHTML = "";
  const st = document.createElement("div"); st.id = "stage"; Object.assign(st.style, { width: W + "px", height: H + "px" }); document.body.appendChild(st);
  const f = document.createElement("div"); f.className = "footer"; f.textContent = nb(FOOTER());
  Object.assign(f.style, { left: M + "px", right: M + "px", bottom: M + "px", fontSize: "20px", color: C.muted }); st.appendChild(f);
  const bottom = H - M - f.offsetHeight - (sq ? 28 : 36);
  const h = document.createElement("div"); h.className = "title"; h.textContent = nb(TITLE);
  Object.assign(h.style, { position: "absolute", left: M + "px", top: (M + 6) + "px", width: (W - 2 * M) + "px", fontSize: (sq ? 40 : 52) + "px", color: C.ink }); st.appendChild(h);
  const top = M + 6 + h.offsetHeight + (sq ? 28 : 40);
  const cols = sq ? 2 : 3, rowsN = sq ? 3 : 2, gx = sq ? 48 : 72, gy = sq ? 24 : 48;
  const pw = (W - 2 * M - gx * (cols - 1)) / cols, ph = (bottom - top - gy * (rowsN - 1)) / rowsN;
  const z = sq ? { title: 28, take: 20, lab: 21, val: 29, bar: 18, gap: 4 } : { title: 40, take: 22, lab: 26, val: 40, bar: 28, gap: 8 };
  ORDER.forEach((k, i) => panel(st, k, M + (i % cols) * (pw + gx), top + Math.floor(i / cols) * (ph + gy), pw, ph, z, "left"));
}
window.build = build;
const q = new URLSearchParams(location.search);
if (q.get("view")) build(q.get("view"), innerWidth, innerHeight);
</script></body></html>
