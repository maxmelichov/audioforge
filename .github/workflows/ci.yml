name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"   # same version as .pre-commit-config.yaml
      - run: ruff check audioforge tests examples scripts   # F, E9, I, B (pyproject.toml)
      - run: ruff check packages/audioforge-client
      - run: pip install "mypy>=1.10" && mypy audioforge/__init__.py audioforge/api.py audioforge/launch.py audioforge/server/cli.py

  # Fast tests: CPU only, no checkpoints, no datasets. Tests that need real models or data skip themselves
  # (their skipif guards look for files under data/ and runs/), and the heavy ones are gated behind RUN_REAL=1 /
  # AUDIOFORGE_BIG_TESTS, neither of which is set here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: docs/CONFIGURATION.md is generated from the flag table
        run: python scripts/dev/gen_config_doc.py --check
      - name: CLI smoke
        run: |
          audioforge-serve --help
          audioforge-download --list
          python -c "import audioforge; print(audioforge.__version__)"
      - name: Fast tests
        env:
          OMP_NUM_THREADS: "2"
          TOKENIZERS_PARALLELISM: "false"
        run: python -m pytest -q -m "not real" $(grep -v "^#" tests/fast_ci.txt) --durations=15
        shell: bash

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/audioforge-client[test]"
      - run: python -m pytest -q packages/audioforge-client/tests
