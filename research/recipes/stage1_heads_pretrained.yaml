# PLAN.md §2 R2 stage 1 / §4 row 7: heads only on NVIDIA's pretrained 115M cache-aware streaming
# FastConformer (runs/nemo_hybrid_streaming_multi.afm, CC-BY-4.0; 1.92% WER at 1 s lookahead).
# The encoder, RNNT and CTC are frozen (pretrained_lr_mult: 0), so LibriSpeech WER cannot move; the
# WER gate is a tripwire for plumbing bugs, not a real risk. New: VAD, EOU, speaker ID (190 AMI
# speakers), 4-speaker Sortformer diarization, and the speaker-aware turn head (speaker kernels at
# encoder layers 0 and 2 + RNNT PredictionNet text state). Speaker heads read a learned mix of all
# layers (from_layers: all) because the frozen top layer is trained to be speaker-invariant.
# Data: synthetic four-move conversations + AMI turn windows + AMI diarization windows, single-source
# batches (data.batching: source), val on AMI dev turn windows.
#
# Run (MPS, one job on the machine, ~30 min):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.5 .venv/bin/python -m audioforge.cli train research/recipes/stage1_heads_pretrained.yaml \
#     -o runs/stage1_heads_pretrained.afm 2>&1 | tee runs/stage1_heads_pretrained.log
# PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.5 caps MPS at half of unified memory (PLAN.md §4 rules).
# Memory estimate (batch 6, AMI windows <= 16 s): ~0.5 GB weights, AdamW state only for ~4M new params,
# activations only for the speaker-conditioned encoder pass (the kernels are trainable) and the # Heads train and are evaluated at the 160 ms streaming context: the ported model's default [70,13]
# is a 1.12 s chunk, which makes sub-400 ms end-of-turn structurally impossible (research/archive/STAGE1.md).
# ~3-5 GB peak on MPS.
name: stage1_heads_pretrained
init: {from: runs/nemo_hybrid_streaming_multi.afm, pretrained_lr_mult: 0}
encoder: {att_context_size: [70, 1], speaker_kernel_layers: [0, 2]}  # 160 ms chunks (ported default [70,13] = 1.12 s); init.from allows these keys
heads:
  # rnnt/ctc: frozen over a frozen encoder, so their losses cannot move anything: weight 0 makes
  # SpeechModel.forward skip them (no RNNT joint at all; its 1.94 GiB temporary OOMed the first run).
  # Stage 2 inherits these weights through init.from and sets them explicitly.
  rnnt: {fused_batch_size: 2, weight: 0}  # merged into the pretrained RNNT config
  ctc: {weight: 0}
  vad: {type: frame, key: vad, hidden: 64, from_layers: all, weight: 0.5}
  eou: {type: frame, key: eou, hidden: 64, pos_weight: 5.0, weight: 0.5}
  spk: {type: speaker, num_speakers: 190, from_layers: all, weight: 0.3}
  # from_layers: all + prefix loss per research/archive/TURN_ABLATION.md (else the head collapses into a VAD
  # on column 0 and outputs ~0 on the growing prefixes the streaming turn path feeds it)
  diar: {type: sortformer, num_spks: 4, from_layers: all, prefix_prob: 0.5, prefix_min: 8, weight: 1.0}
  turn: {type: turn, mode: kernel, use_text: true, condition_on_speaker: true, k_tokens: 4, text_dim: 64,
         align: greedy, hidden: 96, history: 8, pos_weight: 2.0, weight: 1.0}
data:
  mix:
    - {name: conv, synthetic: {kind: conversation, preset: default, n_train: 2500}, weight: 1.0,
       drop_keys: [speaker]}  # ToneLanguage speakers 0-7 would collide with AMI global ids 0-7
    - {name: ami_turn, ami: {mode: turn, window_sec: 16}, weight: 1.0}
    # option (off here): ami: {..., ext_tracks: offline | stream} attaches cached NVIDIA Sortformer tracks
    # (spk_act_ext; scripts/research/make_sortformer_tracks.py) and trainer.conditioning: {p_ext: 0.7} conditions the
    # turn head on them - see research/recipes/stage1_turn_on_sortformer.yaml
    - {name: ami_diar, ami: {mode: diar, window_sec: 16}, weight: 1.0}
  val: {ami: {mode: turn, val_split: dev, n_val: 64}}
  derive: [vad, eou]  # vad = any speaker active (spk_targets); eou = 2 frames after the primary's turn end
  batching: source
  # AMI windows capped at 16 s (T <= 200) instead of 20 s: fewer frames per lattice. NB the turn windows'
  # text is the whole turn even when the window clips its start (datasets/ami.py turn_examples), so
  # U can still reach ~1.6k tokens for a long monologue; that needs a crop there, not here.
trainer:
  device: mps
  # 6 (was 8): the speaker-conditioned encoder pass keeps activations for all items; with fused_batch_size 2
  # the RNNT joint peak is set by the sub-batch, not by this value (see tests/test_mem.py for the arithmetic)
  batch_size: 6
  lr: 1.0e-3
  warmup_steps: 100
  max_steps: 2000
  log_every: 50
  checkpoint_every: 500
  # WER is a fraction: 0.002 = +0.2 absolute points (PLAN.md R2 gate)
  wer_gate: {manifest: data/librispeech/test-clean-first200.jsonl, n: 50, every: 500, max_delta: 0.002,
             head: rnnt}
