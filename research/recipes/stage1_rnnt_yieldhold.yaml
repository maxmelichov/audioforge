# Conversational action tokens in the ASR vocabulary, run 2 (research/YIELD_TOKENS.md): SPEAKER-UNAWARE targets that
# mirror what a single-channel EOU model is trained on. <HOLD> = a >= 0.3 s pause inside one speaker's turn (the AMI
# hesitation label), <YIELD> = the end of every speaker's turn (floor definition, datasets/ami.py), appended to NVIDIA's
# 1024-piece BPE vocabulary (audioforge/vocab.py: ids 1024 / 1025, blank 1024 -> 1026, every other id and row
# unchanged; runs/stage1_rnnt_yieldhold_init.afm = runs/stage1_heads_pretrained.afm + the two rows).
# Transcript of a 16 s AMI train turn window = ALL speakers' words in time order (by start; overlapping speech is
# interleaved), tokens placed at their time (ami.window_action_transcript; tests/test_yield_tokens.py).
# The frozen encoder is untouched (PLAN.md §6); only the RNNT decoder + joint and the CTC projection train.
# Anchor: LibriSpeech train-clean-100 utterances mixed 1:1 (single-source batches), so the decoder keeps seeing clean
# read speech with full transcripts. WER gate on the RNNT every 50 steps (stop if > 0.5 points above the step-0
# baseline, restore the last good checkpoint), checkpoint every 50 (newest 2 kept).
# Run 1 (research/recipes/stage1_rnnt_yieldhold_run1_primary_only.yaml: primary-speaker words only on the same mixed audio,
# lr 2e-4, no anchor) tripped the gate at step 250 (LibriSpeech 2.3 -> 85 % WER): the decoder learnt to delete speech.
#
# Prerequisite (CPU, seconds):
#   .venv/bin/python -m audioforge.vocab runs/stage1_heads_pretrained.afm runs/stage1_rnnt_yieldhold_init.afm '<HOLD>' '<YIELD>'
# Run (MPS, one job on the machine):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.6 PYTORCH_MPS_LOW_WATERMARK_RATIO=0.5 .venv/bin/python -m audioforge.cli train \
#       research/recipes/stage1_rnnt_yieldhold.yaml -o runs/stage1_rnnt_yieldhold.afm 2>&1 | tee runs/stage1_rnnt_yieldhold.log
# Scoring: scripts/research/bench_yield_tokens.py (eot-bench v2, same windows / scorer as scripts/research/bench_turn_baselines.py).
name: stage1_rnnt_yieldhold
init:
  from: runs/stage1_rnnt_yieldhold_init.afm
  pretrained_lr_mult: 0  # everything in pretrained_scope is frozen; heads.rnnt.* / heads.ctc.* (not listed) train at lr
  pretrained_scope: [preprocessor., encoder., layer_mix., heads.vad., heads.eou., heads.spk., heads.diar., heads.turn.]
encoder: {att_context_size: [70, 1], att_context_sizes: [[70, 1]], speaker_kernel_layers: [0, 2]}  # 160 ms only
heads:
  rnnt: {fused_batch_size: 2, weight: 1.0}
  ctc: {weight: 0.1}  # cheap auxiliary; keeps the CTC projection consistent with the new blank index
  vad: {weight: 0}
  eou: {weight: 0}
  spk: {weight: 0}
  diar: {weight: 0}
  turn: {weight: 0}
data:
  mix:
    - {name: ami_turn_actions_all, ami: {mode: turn, window_sec: 16, action_tokens: {hes_gap: 0.3, speakers: all}},
       weight: 1.0, drop_keys: [spk_targets, spk_act, primary_act, eot, hes, speaker]}  # text only
    - {name: librispeech_anchor, librispeech: {train_split: train-clean-100, n_train: 3300, n_val: 200, max_sec: 16.0,
                                               bucket: false},
       weight: 1.0, drop_keys: [speaker, vad, eou]}  # ~1:1 with the 3274 AMI windows
  val: {ami: {mode: turn, val_split: dev, n_val: 64, action_tokens: {hes_gap: 0.3, speakers: all}},
        drop_keys: [spk_targets, spk_act, primary_act, eot, hes, speaker]}
  batching: source
trainer:
  device: mps
  batch_size: 6
  lr: 5.0e-5
  warmup_steps: 100
  max_steps: 2000
  log_every: 50
  checkpoint_every: 50
  checkpoint_keep: 2
  wer_gate: {manifest: data/librispeech/test-clean-first200.jsonl, n: 100, every: 50, max_delta: 0.005, head: rnnt}
