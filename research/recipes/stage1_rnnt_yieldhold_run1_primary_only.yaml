# Conversational action tokens in the ASR vocabulary (research/YIELD_TOKENS.md): <HOLD> (within-turn pause >= 0.3 s
# of the primary speaker = the AMI hesitation label) and <YIELD> (the labelled turn end) appended to NVIDIA's
# 1024-piece BPE vocabulary (audioforge/vocab.py: ids 1024 / 1025, blank moves 1024 -> 1026, every other id and row
# unchanged; runs/stage1_rnnt_yieldhold_init.afm = runs/stage1_heads_pretrained.afm + the two rows). The frozen
# encoder is untouched (PLAN.md §6: the WER gate history forbids unfreezing it); only the pretrained RNNT decoder +
# joint and the CTC projection train, on the primary speaker's action transcript of the AMI train turn windows
# (datasets/ami.py action_transcript; windows as stage 1: 16 s, lead 4 s, trail 2 s, text = words inside the window).
# The other heads keep their weights (frozen, weight 0) so the checkpoint still serves them; the labels they would
# need are dropped so no speaker-conditioned encoder pass runs.
#
# Prerequisite (CPU, seconds):
#   .venv/bin/python -m audioforge.vocab runs/stage1_heads_pretrained.afm runs/stage1_rnnt_yieldhold_init.afm '<HOLD>' '<YIELD>'
# Run (MPS, one job on the machine):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.6 PYTORCH_MPS_LOW_WATERMARK_RATIO=0.5 .venv/bin/python -m audioforge.cli train \
#       research/recipes/stage1_rnnt_yieldhold.yaml -o runs/stage1_rnnt_yieldhold.afm 2>&1 | tee runs/stage1_rnnt_yieldhold.log
# Scoring: scripts/research/bench_yield_tokens.py (eot-bench v2, same windows / scorer as scripts/research/bench_turn_baselines.py).
name: stage1_rnnt_yieldhold
init:
  from: runs/stage1_rnnt_yieldhold_init.afm
  pretrained_lr_mult: 0  # everything in pretrained_scope is frozen; heads.rnnt.* / heads.ctc.* (not listed) train at lr
  pretrained_scope: [preprocessor., encoder., layer_mix., heads.vad., heads.eou., heads.spk., heads.diar., heads.turn.]
encoder: {att_context_size: [70, 1], att_context_sizes: [[70, 1]], speaker_kernel_layers: [0, 2]}  # 160 ms only
heads:
  rnnt: {fused_batch_size: 2, weight: 1.0}
  ctc: {weight: 0.1}  # cheap auxiliary; keeps the CTC projection consistent with the new blank index
  vad: {weight: 0}
  eou: {weight: 0}
  spk: {weight: 0}
  diar: {weight: 0}
  turn: {weight: 0}
data:
  mix:
    - {name: ami_turn_actions, ami: {mode: turn, window_sec: 16, action_tokens: {hes_gap: 0.3}}, weight: 1.0,
       drop_keys: [spk_targets, spk_act, primary_act, eot, hes, speaker]}  # text only: no other head gets labels
  val: {ami: {mode: turn, val_split: dev, n_val: 64, action_tokens: {hes_gap: 0.3}},
        drop_keys: [spk_targets, spk_act, primary_act, eot, hes, speaker]}
  batching: source
trainer:
  device: mps
  batch_size: 6
  lr: 2.0e-4  # fine-tuning a pretrained decoder: 5x below the stage-1 head lr
  warmup_steps: 100
  max_steps: 2000
  log_every: 50
  checkpoint_every: 250  # <= wer_gate.every: a good checkpoint exists when the gate trips
  # LibriSpeech tripwire on the RNNT (the head that trains): stop and restore if WER rises > 0.5 absolute points
  wer_gate: {manifest: data/librispeech/test-clean-first200.jsonl, n: 100, every: 250, max_delta: 0.005, head: rnnt}
