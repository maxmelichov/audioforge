# Stage 1c': turn head v3 trained on AMI turn windows with a 6 s POST-END TRAIL (research/archive/EOT_BENCH_V2.md: at the 6 s
# horizon of eot-bench v2 the deployable silence timeout misses 74.8 % of all / 46.1 % of floor-open turn ends, head v3
# 79.6 % / 80.3 %: v3 was trained on 2 s trails, never saw a post-end frame beyond 2 s, and never learned that a long
# silence of the user means the turn ended).
#
# Identical to research/recipes/stage1_turn_v3.yaml except the AMI train source:
#   trail_sec 6 (was the 2 s default; the trail still stops where the primary's next turn starts or at the meeting end:
#   1353 / 3274 train windows keep the full 6 s = >= 75 post-end frames, 1920 stop at the same speaker's next turn,
#   1 at the meeting end; research/archive/STAGE1.md "Turn head v3 trained on 6 s trails"), window_sec 20 (lead 4 s + turn +
#   6 s trail; the window cap only ever clips the lead, never the trail), and its streaming Sortformer tracks come from
#   data/ami/cache/sortformer/train_trail6/ (ext_tracks.split_dirname: trail_sec != 2 selects <split>_trail<x>; the
#   default 16 s / 2 s caches are untouched). Val = the same 64 AMI dev turns (2 s trail) as v3: the trainer's internal
#   eval only; the scoring is eot-bench v2 (scripts/research/eval_stage1.py --bench v2 --v2-tag trail6).
#
# Prerequisite (MPS, ~35 min, resumable):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.5 PYTORCH_MPS_LOW_WATERMARK_RATIO=0.4 TMPDIR=<scratch> .venv/bin/python \
#       scripts/research/make_sortformer_tracks.py --split train --track-source stream --device mps --trail-sec 6 \
#       --window-sec 20 --budget 540                 # repeat until 3274/3274; then --verify-cpu 3
# Run (GPU):
#   PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.5 PYTORCH_MPS_LOW_WATERMARK_RATIO=0.4 .venv/bin/python -m audioforge.cli train \
#       research/recipes/stage1_turn_v3_trail6.yaml -o runs/stage1_turn_v3_trail6.afm 2>&1 | tee runs/stage1_turn_v3_trail6.log
name: stage1_turn_v3_trail6
init:
  from: runs/stage1_heads_pretrained.afm  # the 160 ms model (saved config: att_context_size [70, 1])
  pretrained_lr_mult: 0
  pretrained_scope: [preprocessor., encoder., layer_mix., heads.rnnt., heads.ctc., heads.vad., heads.eou.,
                     heads.spk., heads.diar.]
encoder: {att_context_size: [70, 1], att_context_sizes: [[70, 1]], speaker_kernel_layers: [0, 2]}
heads:
  diar: {weight: 0}
  turn: {type: turn, mode: kernel, use_text: true, condition_on_speaker: true, k_tokens: 4, text_dim: 64,
         align: greedy, hidden: 96, history: 8, pos_weight: 2.0, weight: 1.0,
         act_columns: 4, duration_feats: true, dur_max: 64,
         future_act_aux: {horizons: [6, 12, 25], weight: 0.3}}
data:
  mix:
    - {name: ami_turn, ami: {mode: turn, window_sec: 20, lead_sec: 4.0, trail_sec: 6.0,
                             ext_tracks: {source: stream, fallback: null, require: true}},
       weight: 1.0}
    - {name: conv, synthetic: {kind: conversation, preset: default, n_train: 2500}, weight: 0.3,
       drop_keys: [speaker]}
  val: {ami: {mode: turn, val_split: dev, n_val: 64}}
  derive: [vad, eou]
  batching: source
trainer:
  device: auto
  batch_size: 6
  lr: 1.0e-3
  warmup_steps: 100
  max_steps: 2000
  log_every: 50
  checkpoint_every: 500
  # model conditioning (trainer.conditioning: the location that survives init.from; see audioforge/model.py)
  conditioning: {p_ext: 0.9, p_diar: 0, flip: 0.01,
                 ext_noise: {p: 0.3, swap_max: 12, drop: 0.2, drop_max: 4, at_turn_end: 0.5}}
  wer_gate: {manifest: data/librispeech/test-clean-first200.jsonl, n: 50, every: 500, max_delta: 0.002,
             head: rnnt}
